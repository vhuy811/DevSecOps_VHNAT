name: Bao mat

# ==========================================================================
# MAU DE DAN VAO REPO BAT KY - chep thanh .github/workflows/bao-mat.yml.
#
# Khong can khai bao gi: ngon ngu, .csproj, Dockerfile, bo rule, cach khoi dong
# app cho DAST deu TU NHAN. Ket qua tu nhan in o dau trang Summary moi lan chay.
# Chi mo khoi "with:" ben duoi khi viec tu nhan sai.
#
# Rule rieng cua repo: dat tep .yaml (cu phap Semgrep) vao .devsecops/rules/.
#
# AI CHAN MERGE: GitHub, khong phai job nay. Sau lan chay dau tren main, vao
# Settings -> Rules -> Rulesets: "Require code scanning results" voi
# Semgrep-du-an (Alerts=Errors, Security>=High) va OWASP-ZAP (Security>=High,
# chi khi DAST chay duoc), required check "security / dependency-review",
# 1 approve, bypass trong.
# ==========================================================================

# Chi quet khi MO PR va khi push vao main: mot PR - mot check - mot moc so sanh.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Bat buoc khi goi workflow khac: thieu khoi nay thi "Startup failure" ngay.
permissions:
  contents: read
  security-events: write

jobs:
  security:
    uses: vhuy811/DevSecOps_VHNAT/.github/workflows/devsecops-reusable.yml@main
    # with:
    #   start-command: 'python app.py'      # app khong tu khoi dong duoc bang compose/dotnet/Dockerfile/npm
    #   app-url: http://localhost:8000      # di kem start-command
    #   health-path: /                      # trang de kiem tra app da len
    #   run-dast: false                     # app can dich vu ngoai ma CI khong co
    #   toolkit-ref: v1.0.0                 # ghim phien ban bo cong cu khi dung that

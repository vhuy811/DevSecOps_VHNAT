# =============================================================================
# BO RULE PHAT HIEN - PYTHON (tang 2, phan tich tinh)
# =============================================================================
#
# Cung triet ly voi sast-detect.yaml (ban C#):
#   - Chi phu nhung CWE ma OWASP ZAP CO active scan rule, de canh bao tinh con
#     duong di tiep den nhan CONFIRMED o tang doi sanh. Phan be rong (mat khau
#     cung, ma hoa yeu, deserialization...) de cho bo rule cong dong p/python.
#   - severity ERROR = co quyen CHAN merge. Chi dat cho rule tin cay cao.
#   - Moi rule ghi "CWE-nnn:" o DAU thong diep VA trong metadata.cwe (tang doi
#     sanh doc ca hai cho).
#
# VI SAO TOAN BO DUNG TAINT MODE (mode: taint)
# Rule khop theo HINH DANG dong code khong phan biet duoc "noi hang so" voi
# "noi input nguoi dung" - do tren Juliet C# cho thay chung bat 100% case loi
# NHUNG bao nham 100% case da sua. Nen o day chi bao khi du lieu that su di tu
# NGUON (doi tuong request) toi DICH ma khong qua ham lam sach.
#
# DIEM THEN CHOT - focus-metavariable O DOI SO THU NHAT:
# Dang AN TOAN cua Python DBAPI la tham so hoa:
#       cursor.execute("SELECT ... WHERE x = ?", (gia_tri,))
# Gia tri nhiem doc nam o doi so THU HAI. Dang LO HONG la noi vao doi so THU
# NHAT. Nho focus-metavariable: $X (chi doi so dau), rule KHONG bao nham dang
# tham so hoa. Bo focus di la rule lap tuc bao nham moi truy van tham so hoa.
#
# GIOI HAN THAT: Semgrep ban cong dong lan theo luong trong MOT ham. Du lieu di
# qua ham khac / tep khac la phan cua CodeQL (threat-models: local).
#
# NGUON CAU HINH (bien moi truong / system property) - DA BO KHOI RULE CHAN
# -----------------------------------------------------------------------------
# Tung co trong MOI rule taint cua tep nay, voi ly le "trong container dung
# chung thi ke tan cong kiem soat duoc bien moi truong". Da BO, chi con
# dso-py-taint-cmdi giu os.environ / os.getenv, vi dich la thuc thi lenh.
#
# BON SO DAN TOI QUYET DINH DO:
#  1. Trong bo rule chinh thuc semgrep/semgrep-rules: 0 / 21 rule taint Java
#     dung System.getenv hoac getProperty lam nguon - khong xuat hien mot lan
#     nao. Ben Python chi 2 / 59 tep co, va ca hai deu CHI dat nguon nay cho
#     DICH THUC THI LENH (dangerous-subprocess-use-tainted-env-args,
#     dangerous-os-exec-tainted-env-args).
#  2. Trong Juliet Java (4920 tep / 2997 case): getProperty la nguon cua 761
#     tep, getenv 222 tep - 983 tep, ho nguon ngoai-HTTP LON NHAT. Nhan nguon
#     nay lam "nhiem doc" nang ti le bat cua corpus len rat nhieu.
#  3. Juliet dung getProperty vi can mot gia tri ma trinh bien dich khong gap
#     lai duoc, KHONG vi no mo hinh hoa ke tan cong. Ma that dung dung hai ham
#     nay de doc CAU HINH TRIEN KHAI - gia tri do nguoi van hanh dat.
#  4. Corpus logic nghiep vu (3 tep, 38 ham ma dung) do duoc hau qua that:
#     dso-java-taint-path-traversal CHAN OAN tepTamBaoCao(), mot ham chi lam
#     new File(System.getProperty("java.io.tmpdir"), "bao_cao_tam.csv").
#
# KET LUAN GHI VAO BAO CAO: "mo rong nguon la mo rong vung bat ma khong mo rong
# vung bao nham" chi dung voi nguon DOC DU LIEU (readLine, ResultSet). Voi
# nguon CAU HINH no sai, va cai gia phai tra khong hien ra tren Juliet - chi
# hien ra tren corpus ma dung. Diem bat tren corpus tong hop tang len nho mot
# ho nguon khong mang quyen dieu khien cua ke tan cong tren ma that KHONG phai
# la diem tang that.
#
# NEU MUON DO LAI: git revert commit nay roi doc lai ca hai phong do - so Juliet
# se tang, so chan oan tren corpus logic nghiep vu se tu 0 len 1.
# =============================================================================

rules:

  # ===========================================================================
  # CWE-89 : SQL Injection          ZAP ascan 40018
  # ===========================================================================
  - id: dso-py-taint-sqli
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      CWE-89: Du lieu tu request duoc noi vao cau lenh SQL (doi so thu nhat cua
      execute / text() / .raw()) ma khong qua tham so hoa. Dung tham so cua
      DBAPI: cursor.execute("... WHERE x = ?", (gia_tri,)) - dau ? / %s / :ten
      va truyen gia tri o doi so thu hai.
    metadata:
      cwe: "CWE-89"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/89.html
    pattern-sources:
      - pattern: $R.args[...]
      - pattern: $R.args.get(...)
      - pattern: $R.args.getlist(...)
      - pattern: $R.form[...]
      - pattern: $R.form.get(...)
      - pattern: $R.values[...]
      - pattern: $R.values.get(...)
      - pattern: $R.get_json(...)
      - pattern: $R.cookies[...]
      - pattern: $R.cookies.get(...)
      - pattern: $R.headers[...]
      - pattern: $R.headers.get(...)
      - pattern: $R.GET[...]
      - pattern: $R.GET.get(...)
      - pattern: $R.POST[...]
      - pattern: $R.POST.get(...)
      - pattern: $R.query_params[...]
      - pattern: $R.query_params.get(...)
      - pattern: request.json
      - pattern: request.data
      # --- Mo rong nguon (G6.2) ---
      # Do tren BenchProctor 18.300 case: cac nguon HTTP khai o tren cham toi
      # 41.5% case; 10 hinh dang duoi day cham toi THEM 33.8% case ma truoc do
      # khong rule nao nhin thay. So dem tep that, khong phai uoc luong.
      - pattern: $R.body                      # Django/Starlette: than yc tho
      - pattern: $R.META[...]                 # Django: header qua WSGI
      - pattern: $R.META.get(...)
      - pattern: $R.get_data(...)             # Flask: than yc tho
      - pattern: $R.COOKIES[...]              # Django: cookie (chu HOA)
      - pattern: $R.COOKIES.get(...)
      - pattern: await $R.form()              # Starlette/FastAPI
      - pattern: await $R.body()
      - pattern: await $R.json()
      # DA BO nguon cau hinh (os.environ / os.getenv) o rule nay - xem khoi
      # "NGUON CAU HINH" o dau tep. Chi dso-py-taint-cmdi con giu.
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: uuid.UUID(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($X, ...)
              - pattern: $CUR.executemany($X, ...)
              - pattern: $CUR.executescript($X)
              - pattern: sqlalchemy.text($X)
              - pattern: text($X)
              - pattern: $M.raw($X, ...)
              - pattern: $M.extra(select=$X, ...)
              - pattern: $M.extra(where=$X, ...)
          - focus-metavariable: $X

  # ===========================================================================
  # CWE-78 : OS Command Injection   ZAP ascan 90020 / 90037
  # ===========================================================================
  - id: dso-py-taint-cmdi
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      CWE-78: Du lieu tu request di vao lenh he dieu hanh chay QUA SHELL
      (os.system / os.popen / subprocess voi shell=True). Shell dien giai dau
      cham phay, dau va, dau ong dan nen input nao cung thanh lenh moi. Dung
      subprocess.run(["lenh", doi_so]) - danh sach, khong shell.
    metadata:
      cwe: "CWE-78"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/78.html
    pattern-sources:
      - pattern: $R.args[...]
      - pattern: $R.args.get(...)
      - pattern: $R.form[...]
      - pattern: $R.form.get(...)
      - pattern: $R.values.get(...)
      - pattern: $R.get_json(...)
      - pattern: $R.cookies.get(...)
      - pattern: $R.headers.get(...)
      - pattern: $R.GET[...]
      - pattern: $R.GET.get(...)
      - pattern: $R.POST[...]
      - pattern: $R.POST.get(...)
      - pattern: $R.query_params.get(...)
      # --- Mo rong nguon (G6.2) ---
      # Do tren BenchProctor 18.300 case: cac nguon HTTP khai o tren cham toi
      # 41.5% case; 10 hinh dang duoi day cham toi THEM 33.8% case ma truoc do
      # khong rule nao nhin thay. So dem tep that, khong phai uoc luong.
      - pattern: $R.body                      # Django/Starlette: than yc tho
      - pattern: $R.META[...]                 # Django: header qua WSGI
      - pattern: $R.META.get(...)
      - pattern: $R.get_data(...)             # Flask: than yc tho
      - pattern: $R.COOKIES[...]              # Django: cookie (chu HOA)
      - pattern: $R.COOKIES.get(...)
      - pattern: await $R.form()              # Starlette/FastAPI
      - pattern: await $R.body()
      - pattern: await $R.json()
      # DA BO nguon cau hinh (os.environ / os.getenv) o rule nay - xem khoi
      # "NGUON CAU HINH" o dau tep. Chi dso-py-taint-cmdi con giu.
      - pattern: os.environ[...]
      - pattern: os.environ.get(...)
      - pattern: os.getenv(...)
    pattern-sanitizers:
      - pattern: shlex.quote(...)
      - pattern: int(...)
    # CHI dang chay qua shell. subprocess.run(["ls", x]) KHONG o day - no an
    # toan va liet vao day la bao nham dang da sua.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.system($X)
              - pattern: os.popen($X, ...)
              - pattern: subprocess.run($X, ..., shell=True, ...)
              - pattern: subprocess.call($X, ..., shell=True, ...)
              - pattern: subprocess.check_call($X, ..., shell=True, ...)
              - pattern: subprocess.check_output($X, ..., shell=True, ...)
              - pattern: subprocess.Popen($X, ..., shell=True, ...)
              - pattern: subprocess.getoutput($X)
          - focus-metavariable: $X

  # ===========================================================================
  # CWE-22 : Path Traversal         ZAP ascan 6
  # ===========================================================================
  - id: dso-py-taint-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      CWE-22: Du lieu tu request duoc dung lam duong dan tep ma khong cat bo
      thu muc. Chuoi "../" hoac duong dan tuyet doi cho phep doc/ghi ngoai thu
      muc du dinh. Dung os.path.basename() hoac werkzeug secure_filename(), roi
      kiem tra ket qua van nam trong thu muc goc.
    metadata:
      cwe: "CWE-22"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/22.html
    pattern-sources:
      - pattern: $R.args[...]
      - pattern: $R.args.get(...)
      - pattern: $R.form[...]
      - pattern: $R.form.get(...)
      - pattern: $R.values.get(...)
      - pattern: $R.get_json(...)
      - pattern: $R.cookies.get(...)
      - pattern: $R.headers.get(...)
      - pattern: $R.GET[...]
      - pattern: $R.GET.get(...)
      - pattern: $R.POST[...]
      - pattern: $R.POST.get(...)
      - pattern: $R.query_params.get(...)
      # --- Mo rong nguon (G6.2) ---
      # Do tren BenchProctor 18.300 case: cac nguon HTTP khai o tren cham toi
      # 41.5% case; 10 hinh dang duoi day cham toi THEM 33.8% case ma truoc do
      # khong rule nao nhin thay. So dem tep that, khong phai uoc luong.
      - pattern: $R.body                      # Django/Starlette: than yc tho
      - pattern: $R.META[...]                 # Django: header qua WSGI
      - pattern: $R.META.get(...)
      - pattern: $R.get_data(...)             # Flask: than yc tho
      - pattern: $R.COOKIES[...]              # Django: cookie (chu HOA)
      - pattern: $R.COOKIES.get(...)
      - pattern: await $R.form()              # Starlette/FastAPI
      - pattern: await $R.body()
      - pattern: await $R.json()
      # DA BO nguon cau hinh (os.environ / os.getenv) o rule nay - xem khoi
      # "NGUON CAU HINH" o dau tep. Chi dso-py-taint-cmdi con giu.
    pattern-sanitizers:
      - pattern: os.path.basename(...)
      - pattern: secure_filename(...)
      - pattern: werkzeug.utils.secure_filename(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($X, ...)
              - pattern: io.open($X, ...)
              - pattern: os.remove($X)
              - pattern: os.unlink($X)
              - pattern: shutil.copy($X, ...)
              - pattern: shutil.copyfile($X, ...)
              - pattern: shutil.rmtree($X, ...)
              - pattern: send_file($X, ...)
              - pattern: flask.send_file($X, ...)
              - pattern: send_from_directory($D, $X, ...)
              - pattern: pathlib.Path($X).read_text(...)
              - pattern: pathlib.Path($X).read_bytes()
          - focus-metavariable: $X

  # ===========================================================================
  # CWE-79 : Cross-Site Scripting   ZAP ascan 40012 / 40014 / 40026
  # ===========================================================================
  - id: dso-py-taint-xss
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      CWE-79: Du lieu tu request duoc dua ra HTML ma khong ma hoa -
      render_template_string / Markup / mark_safe / HttpResponse deu KHONG
      escape. Dung template co auto-escape (render_template) hoac
      html.escape(x) truoc khi ghep.
    metadata:
      cwe: "CWE-79"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/79.html
    pattern-sources:
      - pattern: $R.args[...]
      - pattern: $R.args.get(...)
      - pattern: $R.form[...]
      - pattern: $R.form.get(...)
      - pattern: $R.values.get(...)
      - pattern: $R.get_json(...)
      - pattern: $R.cookies.get(...)
      - pattern: $R.headers.get(...)
      - pattern: $R.GET[...]
      - pattern: $R.GET.get(...)
      - pattern: $R.POST[...]
      - pattern: $R.POST.get(...)
      - pattern: $R.query_params.get(...)
      # --- Mo rong nguon (G6.2) ---
      # Do tren BenchProctor 18.300 case: cac nguon HTTP khai o tren cham toi
      # 41.5% case; 10 hinh dang duoi day cham toi THEM 33.8% case ma truoc do
      # khong rule nao nhin thay. So dem tep that, khong phai uoc luong.
      - pattern: $R.body                      # Django/Starlette: than yc tho
      - pattern: $R.META[...]                 # Django: header qua WSGI
      - pattern: $R.META.get(...)
      - pattern: $R.get_data(...)             # Flask: than yc tho
      - pattern: $R.COOKIES[...]              # Django: cookie (chu HOA)
      - pattern: $R.COOKIES.get(...)
      - pattern: await $R.form()              # Starlette/FastAPI
      - pattern: await $R.body()
      - pattern: await $R.json()
      # DA BO nguon cau hinh (os.environ / os.getenv) o rule nay - xem khoi
      # "NGUON CAU HINH" o dau tep. Chi dso-py-taint-cmdi con giu.
    pattern-sanitizers:
      - pattern: html.escape(...)
      - pattern: markupsafe.escape(...)
      - pattern: escape(...)
      - pattern: django.utils.html.escape(...)
      - pattern: int(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: render_template_string($X, ...)
              - pattern: flask.render_template_string($X, ...)
              - pattern: Markup($X)
              - pattern: markupsafe.Markup($X)
              - pattern: mark_safe($X)
              - pattern: django.utils.safestring.mark_safe($X)
              - pattern: HttpResponse($X, ...)
              - pattern: django.http.HttpResponse($X, ...)
          - focus-metavariable: $X


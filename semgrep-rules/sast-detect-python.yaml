      - pattern: $R.form.get(...)
      - pattern: $R.values[...]
      - pattern: $R.values.get(...)
      - pattern: $R.get_json(...)
      - pattern: $R.cookies[...]
      - pattern: $R.cookies.get(...)
      - pattern: $R.headers[...]
      - pattern: $R.headers.get(...)
      - pattern: $R.GET[...]
      - pattern: $R.GET.get(...)
      - pattern: $R.POST[...]
      - pattern: $R.POST.get(...)
      - pattern: $R.query_params[...]
      - pattern: $R.query_params.get(...)
      - pattern: request.json
      - pattern: request.data
      # --- Mo rong nguon (G6.2) ---

  # CWE: ho cua 79 la {79,80,81,...}, con SSTI duoc danh so CWE-1336 thuoc ho
  # {94,95,96,1336}. Hai ho KHONG giao nhau, nen canh bao SSTI do rule XSS
  # phat ra bi BO khi cham - do tren BenchProctor la 147 case co loi khong
  # duoc tinh, du Semgrep CO bao. Day la loi GAN NHAN, khong phai loi phat
  # hien, va no lam ti le bat thap hon thuc te ma khong co dau hieu gi.
  #
  # Tach thanh rule rieng voi cwe dung la cach sua. SSTI cung khac XSS ve ban
  # chat: XSS chay ma trong trinh duyet nguoi dung, SSTI chay ma TREN SERVER
  # (Jinja2 cho truy cap __class__ / __subclasses__ dan den doc tep va RCE).

  # ===========================================================================
  # CWE-943 : NoSQL Injection (MongoDB $where / $expr)
  # ===========================================================================
  # VI SAO THEM RULE NAY (G6.2)
  # Do tren BenchProctor 18.300 case: 150 case co loi thuoc nhom nay va KHONG
  # CONG CU NAO cua du an nhin thay chung - bo rule chi co sink SQL (execute,
  # text, raw), khong co sink MongoDB. Mot repo dung Mongo thi tang SAST cua du
  # an mu hoan toan voi A03, du README noi "dung duoc cho nhieu loai repo".
  #
  # $where va $expr nhan mot bieu thuc JavaScript chay TREN SERVER Mongo. Noi
  # chuoi vao do la cho ke tan cong viet JavaScript tuy y - nang hon SQLi vi
  # khong co lop tham so hoa nao chen giua.
  #
  # Dang AN TOAN la truy van theo truong, khong dung $where:
  #       db.users.find({"username": ten})      <- gia tri, khong phai ma
  #
  # VI SAO DE MUC ERROR (co quyen chan): tieu chi cua du an la "hinh dang hiem
  # va gan nhu luon la loi that", khong phai ti le bao nham tren corpus. $where
  # cong voi noi chuoi la dang hiem trong ma that va gan nhu luon sai. DU DOAN
  # TREN BENCHPROCTOR: se bao nham khoang 27% case sach cua nhom nay, vi 80/300
  # case sach dung "kiem bang if roi return 400" - mot dang ma pattern-sanitizers
  # cua Semgrep KHONG dien ta duoc (xem PHAT_HIEN_BENCHPROCTOR.md). Con so do
  # la dac diem cua corpus (moi case sach la mot case loi duoc sua vua du),
  # khong suy ra duoc cho ma that.
  - id: dso-py-taint-nosqli
    mode: taint
    languages: [python]
    severity: ERROR
    message: >-
      CWE-943: Du lieu tu request duoc noi vao bieu thuc $where / $expr cua
      MongoDB. Hai toan tu nay chay JavaScript tren server nen input thanh ma
      thuc thi - khong co tham so hoa nao chen giua. Dung truy van theo truong:
      db.users.find({"username": gia_tri}).
    metadata:
      cwe: "CWE-943"
      category: security
      subcategory: [vuln]
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/943.html
        - https://www.mongodb.com/docs/manual/reference/operator/query/where/
    pattern-sources:
      - pattern: $R.args[...]
      - pattern: $R.args.get(...)
      - pattern: $R.args.getlist(...)
      - pattern: $R.form[...]
      - pattern: $R.form.get(...)
      - pattern: $R.values[...]
      - pattern: $R.values.get(...)
      - pattern: $R.get_json(...)
      - pattern: $R.cookies[...]
      - pattern: $R.cookies.get(...)
      - pattern: $R.headers[...]
      - pattern: $R.headers.get(...)
      - pattern: $R.GET[...]
      - pattern: $R.GET.get(...)
      - pattern: $R.POST[...]
      - pattern: $R.POST.get(...)
      - pattern: $R.query_params[...]
      - pattern: $R.query_params.get(...)
      - pattern: request.json
      - pattern: request.data
      # --- Mo rong nguon (G6.2) ---
      # Do tren BenchProctor 18.300 case: cac nguon HTTP khai o tren cham toi
      # 41.5% case; 10 hinh dang duoi day cham toi THEM 33.8% case ma truoc do
      # khong rule nao nhin thay. So dem tep that, khong phai uoc luong.
      - pattern: $R.body                      # Django/Starlette: than yc tho
      - pattern: $R.META[...]                 # Django: header qua WSGI
      - pattern: $R.META.get(...)
      - pattern: $R.get_data(...)             # Flask: than yc tho
      - pattern: $R.COOKIES[...]              # Django: cookie (chu HOA)
      - pattern: $R.COOKIES.get(...)
      - pattern: await $R.form()              # Starlette/FastAPI
      - pattern: await $R.body()
      - pattern: await $R.json()
      # DA BO nguon cau hinh (os.environ / os.getenv) o rule nay - xem khoi
      # "NGUON CAU HINH" o dau tep. Chi dso-py-taint-cmdi con giu.
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: uuid.UUID(...)
      - pattern: bson.ObjectId(...)
      - pattern: ObjectId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Dang `{..., "k": $X, ...}` voi dau ... o CA HAI phia tung
              # lam Semgrep tu choi ca tep rule (xem ghi chu trong
              # chay_kiem_thu.py). Chi de ... o dau - do la dang Semgrep
              # ghi trong tai lieu cho dict cua Python.
              # Viet trong KHOI LITERAL (`pattern: |`), khong viet thang.
              # `{` la cu phap DICT cua YAML: `pattern: {..., "$where": $X}`
              # bi doc thanh mapping {'...': None, '$where': '$X'} - mot gia
              # tri null ma Semgrep tu choi, va no tu choi CA TEP RULE. Dieu
              # nguy hiem la yaml.safe_load van chay tron tru, nen kiem "YAML
              # co hop le khong" o may KHONG bat duoc. Da mat mot vong CI.
              # Khoi literal la cach cac rule chinh thuc cua Semgrep viet dict
              # pattern, vi du trong semgrep-rules/python:
              #     {..., 'BACKEND': ..., 'OPTIONS': {..., 'autoescape': $F, ...}, ...}
              - pattern: |
                  {..., "$where": $X, ...}
              - pattern: |
                  {..., '$where': $X, ...}
              - pattern: |
                  {..., "$expr": $X, ...}
              - pattern: |
                  {..., '$expr': $X, ...}
          - focus-metavariable: $X


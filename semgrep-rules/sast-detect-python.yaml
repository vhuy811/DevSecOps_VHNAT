      # "NGUON CAU HINH" o dau tep. Chi dso-py-taint-cmdi con giu.
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: requests.get($X, ...)
              - pattern: requests.post($X, ...)
              - pattern: requests.put($X, ...)
              - pattern: requests.delete($X, ...)
              - pattern: requests.head($X, ...)
              - pattern: requests.request($M, $X, ...)
              - pattern: httpx.get($X, ...)
              - pattern: httpx.post($X, ...)
              - pattern: urllib.request.urlopen($X, ...)
              - pattern: urlopen($X, ...)
              # Do tren BenchProctor: 72/300 case SSRF co loi dung socket
              # tho, khong qua requests/urllib - truoc khong sink nao thay.
              # Viet tuple tuong minh ($X, $CONG) thay vi ($X, ...): dang
              # co dau ... LONG trong tuple khong thay trong bo rule chinh thuc
              # nao cua Semgrep, nen khong co bang chung la Semgrep phan tich
              # duoc. Dang tuong minh thi chac chan phan tich duoc, va van bat
              # dung create_connection((host, port)).
              - pattern: socket.create_connection(($X, $CONG), ...)
              - pattern: create_connection(($X, $CONG), ...)
          - focus-metavariable: $X

  # ===========================================================================
  # CWE-601 : Open Redirect         ZAP ascan 20019
  # ===========================================================================
  - id: dso-py-taint-open-redirect
    mode: taint
    languages: [python]
    severity: ERROR

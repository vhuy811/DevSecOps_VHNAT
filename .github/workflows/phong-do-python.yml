name: Phong do Python

# G4.2 - DO BO RULE PYTHON TREN CORPUS THAT
#
# Cung ly do nhu phong do Java: 8 rule Python tu truoc den gio chi qua fixture
# Co_Loi.py / Da_Khu_Doc.py, tuc chi chung minh "rule khong mu va khong bao
# nham tren may case tu viet". Khong phai mot ti le.
#
# VI SAO KHONG DUNG JULIET
# NIST chua bao gio lam Juliet cho Python - Juliet chi co C/C++, Java, C#.
# Phan Python trong SARD la test case le, khong co cau truc bad/good. Da thu
# 9 ten mirror hop ly tren GitHub, khong ten nao ton tai.
#
# BO DO DUOC CHON: BenchProctor (TheAuditorTool), tier quicktest, Python.
# 18.300 test case, 9.150 co loi / 9.150 sach, 59 CWE, 3 khung (flask, fastapi,
# django). Dang gan nhan: answer key CSV NAM NGOAI ma nguon - ma nguon khong co
# comment, khong tag CWE, ten tep khong noi gi. Nho vay khong the "bat duoc"
# bang cach doc nhan.
#
# GHIM: SHA cua repo + sha256 cua zip. Ca hai deu duoc kiem trong job; lech thi
# dung, vi bo do doi thi so do cu khong con so sanh duoc.
#
# AN TOAN: corpus la ma nguon co y chua lo hong cua repo khac. O day chi duoc
# DOC: Semgrep quet tinh, CodeQL build-mode none nen khong bien dich. Khong
# buoc nao chay bat ky tep nao cua corpus (ke ca score_sarif.py di kem - du an
# dung bo cham rieng, tools/cham_diem.py bench-csv).
#
# HAI HAN CHE CUA BO DO, phai ghi ro khi dung so nay trong bao cao:
#   1. Case la single-file: moi tep mot cap nguon -> sink, khong co luong lien
#      tep. Nen bo do nay KHONG do duoc phan tich lien thu tuc.
#   2. Nhan do may sinh (generator 0.13.3), khong phai nguoi review tung case.
#      Benchmark moi, mot nha phat trien, chua qua peer review cong dong -
#      khac voi Juliet cua NIST. Da doi chieu tay 4 cap (CWE-89, 78, 22, 79):
#      ca 4 dung, case "sach" dung sanitizer that (bleach, realpath + kiem tien
#      to, allowlist, truy van tham so hoa). 4/18.300 la mau nho.
#
# DU DOAN TRUOC KHI DO: da liet ke toan bo hinh dang nguon ma corpus dung va
# doi chieu voi nguon khai trong rule. Rule phu 5/13 hinh dang (~55% so lan
# xuat hien): thieu request.META.get, os.environ.get, request.COOKIES.get,
# request.body, await request.form()/body(), request.get_data(). Sink thi khop
# het (db.execute, subprocess.Popen shell=True, open(), requests.get()).

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'semgrep-rules/sast-detect-python.yaml'
      - 'semgrep-rules/kiem-thu-rule/Co_Loi.py'
      - 'semgrep-rules/kiem-thu-rule/Da_Khu_Doc.py'
      - 'tools/cham_diem.py'
      - '.github/workflows/phong-do-python.yml'

permissions:
  contents: read
  actions: read
  security-events: write   # codeql-action can quyen nay ke ca khi upload: never

env:
  BP_REPO: https://github.com/TheAuditorTool/BenchProctor.git
  BP_SHA: 9c5bc0fa663262efc8f963142a0604675d2636f1
  BP_ZIP: benchproctor-python-quicktest-2026.07.22.zip
  BP_SHA256: 8a80cd9efa00464d37aa40010a735f2ebfbe6ff3650a28a2321c2927d9f3976f

jobs:
  bench-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Kiem thu rule tren fixture (Co_Loi / Da_Khu_Doc)
        run: python semgrep-rules/kiem-thu-rule/chay_kiem_thu.py

      - name: Lay BenchProctor Python quicktest (ghim SHA + sha256)
        run: |
          git clone -q --filter=blob:none --sparse --no-checkout "$BP_REPO" bp
          cd bp
          git sparse-checkout init --cone
          git sparse-checkout set Benchmarks/quicktest/python
          git fetch -q --depth 1 --filter=blob:none origin "$BP_SHA"
          git checkout -q FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$BP_SHA" \
            || { echo "SHA repo khong khop ban da ghim"; exit 1; }
          cd Benchmarks/quicktest/python
          echo "$BP_SHA256  $BP_ZIP" | sha256sum -c - \
            || { echo "sha256 cua zip khong khop ban da ghim"; exit 1; }
          cd "$GITHUB_WORKSPACE"
          # Giai nen ra thu muc RIENG, khong lan voi ma cua du an.
          mkdir -p bench ket-qua
          unzip -q "bp/Benchmarks/quicktest/python/$BP_ZIP" -d bench
          rm -rf bp
          CORPUS=$(dirname "$(find bench -name 'benchproctor-manifest.json' | head -1)")
          echo "CORPUS=$CORPUS" >> "$GITHUB_ENV"
          echo "Corpus o: $CORPUS"
          echo "So tep .py: $(find "$CORPUS" -name '*.py' | wc -l)"
          echo "$BP_SHA" > ket-qua/benchproctor.sha
          echo "$BP_SHA256" >> ket-qua/benchproctor.sha

      - name: Semgrep - rule du an (dang co quyen chan trong pipeline)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config semgrep-rules/sast-detect-python.yaml \
            --no-git-ignore --disable-nosem --metrics=off \
            --sarif --output ket-qua/semgrep-du-an.sarif "$CORPUS"

      - name: Semgrep - rule cong dong (p/python, p/security-audit)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/python --config p/security-audit \
            --no-git-ignore --disable-nosem --metrics=off \
            --sarif --output ket-qua/semgrep-cong-dong.sarif "$CORPUS"

      - name: CodeQL - khoi tao (Python, security-extended)
        id: cq_init
        uses: github/codeql-action/init@v4
        with:
          languages: python
          build-mode: none
          queries: security-extended
          source-root: bench

      - name: CodeQL - dong goi CSDL (khong chay truy van)
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          skip-queries: true
          category: phong-do-python

      - name: CodeQL - phan tich (threat model mac dinh = remote)
        run: |
          CQ="${{ steps.cq_init.outputs.codeql-path }}"
          "$CQ" database analyze "$RUNNER_TEMP/codeql_databases/python" \
            codeql/python-queries:codeql-suites/python-security-extended.qls \
            --format=sarif-latest \
            --output=ket-qua/codeql.sarif --threads=0 --rerun

      - name: CodeQL - phan tich lai voi threat model local (do them)
        continue-on-error: true
        run: |
          CQ="${{ steps.cq_init.outputs.codeql-path }}"
          "$CQ" database analyze "$RUNNER_TEMP/codeql_databases/python" \
            codeql/python-queries:codeql-suites/python-security-extended.qls \
            --threat-model=local --format=sarif-latest \
            --output=ket-qua/codeql-local.sarif --threads=0 --rerun

      - name: Cham diem
        run: |
          python tools/cham_diem.py bench-csv \
            --bo "flask=$CORPUS/flask" \
            --bo "fastapi=$CORPUS/fastapi" \
            --bo "django=$CORPUS/django" \
            --sarif semgrep-du-an=ket-qua/semgrep-du-an.sarif \
            --sarif semgrep-cong-dong=ket-qua/semgrep-cong-dong.sarif \
            --sarif codeql=ket-qua/codeql.sarif \
            --sarif codeql-local=ket-qua/codeql-local.sarif \
            --chan "chi-semgrep=semgrep-du-an:level=error" \
            --chan "pipeline-hien-tai=semgrep-du-an:level=error" \
            --chan "pipeline-hien-tai=codeql-local:sev>=4&!cwe=643" \
            --do-nguong \
            --out ket-qua/bench-python.json --md ket-qua/bench-python.md
          cat ket-qua/bench-python.md >> "$GITHUB_STEP_SUMMARY"

      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phong-do-python
          path: ket-qua/
          retention-days: 30

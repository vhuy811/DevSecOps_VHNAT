name: DevSecOps - nam tang kiem thu (dung chung)

# ==========================================================================
# WORKFLOW DUNG CHUNG - mot pipeline, nhieu repo.
#
# Repo khac khong can copy tools/ hay semgrep-rules/. No chi can them mot tep
# nho trong .github/workflows/ goi toi day:
#
#     jobs:
#       security:
#         uses: vhuy811/DevSecOps_VHNAT/.github/workflows/devsecops-reusable.yml@main
#
# Khong can khai bao gi them: ngon ngu, .csproj, Dockerfile, bo rule deu TU
# NHAN; app tu khoi dong cho DAST (docker compose / dotnet / Dockerfile / npm).
# Cac input ben duoi chi de GHI DE khi viec tu nhan sai.
#
# Day la cach to chuc that trien khai DevSecOps: pipeline nam mot cho, hang
# tram repo tham chieu toi. Sua mot lan, ca tram repo duoc cap nhat. Neu moi
# repo giu mot ban sao thi sau sau thang chung se troi moi noi mot kieu.
#
# AI CHAN MERGE? Khong phai job nay. Job nay luon xanh khi chay xong; no day
# ket qua tung scanner len Code Scanning (SARIF). GitHub tu tinh alert MOI
# trong PR, hien chu thich dung dong, va ruleset "Require code scanning
# results" tren main khoa merge theo nguong tung cong cu:
#   Semgrep-du-an  : Alerts = Errors, Security >= High   (rule tu viet, tin cay cao)
#   CodeQL         : Alerts = Errors, Security >= Medium (lan theo luong du lieu - job codeql)
#                    TRU CWE-643: bo khoi tang nay vi bat 76% / bao nham 76%.
#                    XPath injection do dso-taint-xpathi chan (49% / 0%).
#   OWASP-ZAP      : Security >= High                   (DAST tren app dung tu PR)
#   DAST-runtime   : Security >= Medium                 (rule runtime chon lam_khoa: CSP, X-Frame-Options)
#   DAST-idor      : Security >= High                    (IDOR/BOLA CWE-639 - kiem co xac thuc, G3.4)
#   dependency-review (job rieng): required check      (goi MOI dinh CVE >= High)
# Rule cong dong, Trivy, Gitleaks day len de tham khao/theo doi. Bao nham xu ly
# bang Dismiss + ly do trong tab Security - co audit, khong sua code de ne.
#
# DIEU CAN BIET: workflow duoc goi se checkout ma nguon cua REPO GOI NO, chu
# khong phai repo chua workflow. Nen no phai TU keo bo cong cu ve, vao thu muc
# .devsecops-toolkit/ - va moi buoc quet deu phai loai thu muc do ra, neu
# khong ket qua se lan ma nguon cua bo cong cu vao ma nguon cua repo dich.
# ==========================================================================

# AN NINH CHUOI CUNG UNG - vi sao moi buoc checkout deu co
# persist-credentials: false
#
# Mac dinh actions/checkout GHI GITHUB_TOKEN vao .git/config va de no o do den
# het job. Pipeline nay lai co y chay nhieu image :latest (de CSDL lo hong luon
# moi) VA mount workspace vao chung - semgrep o /src va gitleaks o /repo la
# mount READ-WRITE. Mot ban image bi chiem chi can doc .git/config la co token
# ghi duoc vao repo: mot lo hong chuoi cung ung that, nam ngay trong cong cu
# dang di tim lo hong.
#
# Khong buoc nao trong toan bo workflow cua bo cong cu nay chay git push hay
# git commit (da kiem), nen tat han viec luu token khong lam vo gi. Cac tang
# can quyen (day SARIF, doc artifact) lay token tu moi truong, khong qua
# .git/config.

on:
  workflow_call:
    inputs:
      project-file:
        description: 'Ghi de .csproj cua app web. De trong = tu tim (.csproj co Sdk.Web, bo qua du an test).'
        type: string
        required: false
        default: ''
      start-command:
        description: >-
          Lenh khoi dong app cho DAST, dung khi viec tu nhan khong du (vd app Python).
          De trong = tu chon: docker compose -> dotnet -> Dockerfile -> npm start.
        type: string
        required: false
        default: ''
      app-url:
        description: 'Ghi de URL app sau khi chay. De trong = suy ra tu cach khoi dong.'
        type: string
        required: false
        default: ''
      health-path:
        description: 'Duong dan kiem tra app da len chua (bat ky phan hoi < 500 deu tinh la da len).'
        type: string
        required: false
        default: '/'
      dotnet-version:
        description: 'Phien ban .NET SDK.'
        type: string
        required: false
        default: '9.0.x'
      dockerfile:
        description: 'Ghi de Dockerfile. De trong = tu tim Dockerfile dau tien trong repo.'
        type: string
        required: false
        default: ''
      title:
        description: 'Ten hien thi tren bao cao. De trong thi lay ten repo.'
        type: string
        required: false
        default: ''
      toolkit-ref:
        description: 'Nhanh hoac tag cua bo cong cu. Production nen ghim tag thay vi main.'
        type: string
        required: false
        default: 'main'
      run-dast:
        description: >-
          Chay tang dong (ZAP) hay khong. Dat false cho repo khong khoi dong
          duoc trong CI vi thieu CSDL hay dich vu phu. Cac tang tinh van chay
          binh thuong, va trang ket qua se NOI RO la tang dong da bi bo qua -
          khong de nguoi doc hieu nham thanh "da kiem chung va sach".
        type: boolean
        required: false
        default: true
      semgrep-packs:
        description: >-
          Ghi de bo rule cong dong. De trong = tu chon theo ngon ngu nhan ra
          trong repo (p/csharp, p/javascript, p/python...). Tai tu registry luc
          chay nen luon la ban moi nhat.
        type: string
        required: false
        default: ''
      run-image-scan:
        description: 'Quet CVE trong container image. Ton them vai phut nen mac dinh chi chay o nhanh chinh.'
        type: boolean
        required: false
        default: true

jobs:
  scan:
    # needs nhan-dien: nhan dien ngon ngu chi chay MOT lan, o job do (xem buoc
    # "Nhan dien du an" ben duoi). Dong thoi lay luon quyet dinh chan trung.
    needs: nhan-dien
    if: needs.nhan-dien.outputs.bo_qua != 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write   # can de day SARIF len Code Scanning

    env:
      TOOLKIT: .devsecops-toolkit
      TITLE: ${{ inputs.title != '' && inputs.title || github.event.repository.name }}

    steps:
      - name: Lay ma nguon cua repo goi
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
          fetch-depth: 0

      # Mot commit chi sua tai lieu thi khong can build ung dung va ban payload.
      # Nhung KHONG duoc dung paths-ignore o phan "on:" de lam viec nay: check
      # nay thuong la Required, workflow khong chay thi GitHub treo PR vinh
      # vien o "Expected - waiting for status to be reported" va khong con
      # merge duoc nua. Vi vay job VAN chay, chi bo bot buoc ben trong.
      - name: Xac dinh pham vi thay doi
        id: pham_vi
        run: |
          EV="${{ github.event_name }}"
          if [ "$EV" = "schedule" ] || [ "$EV" = "workflow_dispatch" ]; then
            echo "Quet dinh ky hoac chay tay: quet day du, khong co moc baseline."
            echo "chi_tai_lieu=false" >> "$GITHUB_OUTPUT"
            echo "moc=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EV" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi

          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify --quiet "$BASE^{commit}" > /dev/null; then
            echo "Khong co moc de so sanh (nhanh vua tao): quet day du, khong co baseline."
            echo "chi_tai_lieu=false" >> "$GITHUB_OUTPUT"
            echo "moc=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Moc nay dung cho HAI viec: xac dinh commit chi sua tai lieu (o day)
          # va tinh baseline cho cong chan (buoc Semgrep baseline phia duoi).
          echo "moc=$BASE" >> "$GITHUB_OUTPUT"
          CHANGED=$(git diff --name-only "$BASE" HEAD)
          echo "Tep thay doi so voi $BASE:"
          echo "$CHANGED" | sed 's/^/    /'

          KHAC=$(echo "$CHANGED" | grep -vE '\.(md|txt|png|jpe?g|gif)$|^docs/|^LICENSE' || true)

          if [ -n "$CHANGED" ] && [ -z "$KHAC" ] && [ "$EV" = "pull_request" ]; then
            # PR thi LUON quet du: ruleset "Require code scanning results" doi
            # Semgrep-du-an va OWASP-ZAP co ket qua cho TUNG commit cua PR. Bo
            # qua hai tang do thi PR chi sua README cung treo mai o "Code scanning
            # is waiting for results", khong merge duoc.
            echo "chi_tai_lieu=false" >> "$GITHUB_OUTPUT"
            echo "==> PR chi sua tai lieu nhung VAN quet day du (ruleset can ket qua moi cong cu)."
          elif [ -n "$CHANGED" ] && [ -z "$KHAC" ]; then
            echo "chi_tai_lieu=true" >> "$GITHUB_OUTPUT"
            echo "==> Chi thay doi tai lieu. Bo qua cac tang can build va chay ung dung."
          else
            echo "chi_tai_lieu=false" >> "$GITHUB_OUTPUT"
            echo "==> Co thay doi ma nguon hoac cau hinh: quet day du."
          fi

      # ===============================================================
      # TANG 0 - Secret
      # Chay TRUOC khi keo bo cong cu ve, de khong quet nham ma nguon cua
      # chinh bo cong cu. Re nhat va hau qua nang nhat: mot khoa API lo vao
      # lich su git thi xoa o commit sau khong go duoc no khoi commit truoc.
      # ===============================================================
      - name: Gitleaks - quet secret trong ma nguon
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git \
            --report-format=sarif --report-path=/repo/reports/gitleaks.sarif \
            --exit-code 0 --redact

          # Gitleaks KHONG tao tep SARIF khi khong tim thay gi. Doc thang vao
          # tep do lam buoc nay hong ngay ca khi ma nguon sach.
          #
          # Xu ly dung: tao mot SARIF rong hop le de buoc day ket qua o cuoi
          # van chay duoc, va NOI RO trong log rang "khong co tep" khac voi
          # "da quet va sach" - dung nguyen tac cua chinh do an nay.
          if [ -f reports/gitleaks.sarif ]; then
            N=$(python -c "import json;print(sum(len(r.get('results',[])) for r in json.load(open('reports/gitleaks.sarif')).get('runs',[])))")
            echo "Gitleaks: $N phat hien."
          else
            N=0
            printf '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' \
              > reports/gitleaks.sarif
            echo "Gitleaks khong sinh bao cao. Coi nhu 0 phat hien de pipeline di tiep,"
            echo "nhung day la 'khong co ket qua' chu chua phai bang chung ma nguon sach."
          fi
          echo "GITLEAKS_COUNT=$N" >> $GITHUB_ENV

      - name: Keo bo cong cu DevSecOps ve
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
          repository: vhuy811/DevSecOps_VHNAT
          ref: ${{ inputs.toolkit-ref }}
          path: .devsecops-toolkit

      # ===============================================================
      # NHAN DIEN DU AN - khong bat repo goi khai bao gi.
      # Ngon ngu -> cong cu, .csproj web, Dockerfile, bo rule cong dong.
      # Input nao duoc khai bao thi ghi de phan tu nhan tuong ung.
      # ===============================================================
      - name: Nhan dien du an (tu dong)
        id: du_an
        env:
          PF_IN: ${{ inputs.project-file }}
          DF_IN: ${{ inputs.dockerfile }}
          PACKS_IN: ${{ inputs.semgrep-packs }}
          PACKS_NHAN: ${{ needs.nhan-dien.outputs.packs }}
          NHUNG_NHAN: ${{ needs.nhan-dien.outputs.nhung }}
        run: |
          # Nhan dien ngon ngu KHONG chay lai o day. Job nhan-dien da chay
          # nhan_ngon_ngu.py va truyen ket qua qua output.
          #
          # Truoc day ca HAI job deu chay script nay, song song va doc lap. Hai
          # cai gia: mot luot duyet toan repo bi lam doi, va - nang hon - hai
          # tang co the LECH NHAU, vi scan lay bo rule Semgrep tu lan chay cua
          # no con codeql lay danh sach ngon ngu tu lan chay cua nhan-dien.
          # Lech thi khong ai thay. Gio chi con MOT nguon su that cho moi tang.
          mkdir -p reports
          BO="--exclude-dir=.git --exclude-dir=$TOOLKIT --exclude-dir=node_modules --exclude-dir=bin --exclude-dir=obj"
          PF="$PF_IN"
          if [ -z "$PF" ]; then
            # .csproj cua app web (Sdk.Web / Sdk.Razor), bo du an test
            PF=$(grep -rlIs $BO --include='*.csproj' -E 'Sdk="Microsoft\.NET\.Sdk\.(Web|Razor|BlazorWebAssembly)"' . \
                 | grep -viE '(^|/)[^/]*(test|tests|spec)[^/]*(/|$)' | sort | head -1 | sed 's#^\./##')
          fi
          DF="$DF_IN"
          if [ -z "$DF" ]; then
            DF=$(find . -path ./.git -prune -o -path "./$TOOLKIT" -prune -o -path ./node_modules -prune \
                 -o -type f -iname 'Dockerfile' -print | sort | head -1 | sed 's#^\./##')
          fi
          PACKS="$PACKS_IN"
          if [ -z "$PACKS" ]; then
            PACKS="$PACKS_NHAN"
          fi
          NHUNG=$(python -c "import json,os;print(' '.join(json.loads(os.environ.get('NHUNG_NHAN') or '[]')))")
          # tep de gan alert ZAP khong anh xa duoc ve dong code nao
          FB=""
          for f in "$PF" "$DF" package.json README.md; do
            if [ -n "$f" ] && [ -f "$f" ]; then FB="$f"; break; fi
          done
          {
            echo "project_file=$PF"
            echo "dockerfile=$DF"
            echo "semgrep_packs=$PACKS"
            echo "thu_muc_nhung=$NHUNG"
            echo "tep_du_phong=${FB:-README.md}"
          } >> "$GITHUB_OUTPUT"
          nguon() { [ -n "$1" ] && echo "khai báo" || echo "tự tìm"; }
          {
            echo "| Mục | Giá trị | Nguồn |"
            echo "|---|---|---|"
            echo "| Dự án .NET web | \`${PF:-không có}\` | $(nguon "$PF_IN") |"
            echo "| Dockerfile | \`${DF:-không có}\` | $(nguon "$DF_IN") |"
            echo "| Bộ rule cộng đồng | \`$PACKS\` | $(nguon "$PACKS_IN") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cai .NET SDK
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true' && steps.du_an.outputs.project_file != ''
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Cai phu thuoc Python
        run: pip install requests

      # ===============================================================
      # TANG 1 - Thu vien (SCA): CVE trong goi NuGet
      # Tang nay khong suy doan: no so phien ban voi CSDL lo hong da cong bo.
      # ===============================================================
      - name: SCA - doi chieu thu vien voi CSDL lo hong
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true' && steps.du_an.outputs.project_file != ''
        run: |
          dotnet restore "${{ steps.du_an.outputs.project_file }}"
          python "$TOOLKIT/tools/sca.py" --repo . --out reports/sca.json || true
          if [ -f reports/sca.json ]; then
            python - <<'PY'
          import json
          s = json.load(open("reports/sca.json"))["summary"]
          print(f"SCA: {s['packages']} goi dinh lo hong, {s['advisories']} advisory")
          print(f"     Critical {s['by_severity']['Critical']}, High {s['by_severity']['High']}")
          PY
          fi

      # ===============================================================
      # TANG 1b - Thu vien JS NHUNG SAN (wwwroot/lib, vendor/, *.min.js)
      # Chep thang vao repo nen KHONG nam trong package.json / lockfile nao:
      # sca.py (NuGet), dependency-review va SBOM deu khong thay. retire.js nhan
      # thu vien theo NOI DUNG tep (chu thich dau tep, ten tep, bam) roi doi
      # chieu voi CSDL lo hong cua no. Ghim ban cong cu; CSDL van tai moi.
      # Loi -> KHONG ghi SARIF: "chua quet" khac "quet xong, sach".
      # ===============================================================
      - name: SCA - thu vien JS nhung san (retire.js)
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          npx --yes retire@5.7.0 --path . --verbose --outputformat json \
            --outputpath reports/retire.json --exitwith 0 || echo "::warning::retire.js thoat voi ma $?"
          python "$TOOLKIT/tools/retire_sarif.py" --vao reports/retire.json \
            --ra reports/thu-vien-nhung.sarif --bo "$TOOLKIT" --summary >> "$GITHUB_STEP_SUMMARY" || true

      # ===============================================================
      # TANG 2 - Ma nguon (SAST) - Semgrep, HAI luot quet
      #
      #   Luot 1 - rule cua bo cong cu + rule rieng cua repo (.devsecops/rules/*.yaml)
      #            -> Semgrep-du-an: tin cay cao, co quyen CHAN (level error)
      #   Luot 2 - bo rule cong dong, tu chon theo ngon ngu nhan ra
      #            -> Semgrep-cong-dong: tham khao
      # Nhom quyet dinh theo LUOT QUET, khong theo ten rule: repo nao cung them
      # duoc rule rieng ma khong phai dat ten theo quy uoc nao.
      # Thu vien nhung san (wwwroot/lib, vendor/, *.min.js) khong quet SAST.
      # GitHub tu tinh alert nao la MOI trong PR bang cach so voi nhanh goc.
      # ===============================================================
      - name: Semgrep - quet ma nguon
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true'
        env:
          PACKS: ${{ steps.du_an.outputs.semgrep_packs }}
          NHUNG: ${{ steps.du_an.outputs.thu_muc_nhung }}
        run: |
          # KHONG TON TRONG `// nosemgrep`. Bao nham xu ly bang Dismiss + ly do tren
          # GitHub (co audit, co nguoi mo lai duoc), khong bang cach sua code.
          #
          # Chi --disable-nosem la KHONG DU: o PR #1 (commit b5487dd), them
          # `// nosemgrep` vao dong loi thi check Semgrep-du-an chuyen xanh, merge mo.
          # Ket qua co "suppressions" trong SARIF bi GitHub coi la da dong.
          # Nen truoc khi quet, doi "nosem" thanh "no_sem" trong ban checkout TAM
          # cua CI (repo khong bi dong toi). Giu nguyen so dong -> vi tri canh bao
          # khong lech. sarif_tools.py con xoa suppressions lan nua.
          # Tai lieu (.md, .txt...) Semgrep khong quet nen khong dem - tranh bao dong
          # gia khi README chi NHAC toi nosemgrep.
          NOSEM_BO="--exclude-dir=.git --exclude-dir=$TOOLKIT --exclude-dir=.devsecops --exclude-dir=kiem-thu-rule"
          NOSEM_BO="$NOSEM_BO --exclude=*.md --exclude=*.markdown --exclude=*.txt --exclude=*.rst --exclude=*.adoc"
          N_NOSEM=$(grep -rIilZ $NOSEM_BO 'nosem' . | tr -cd '\0' | wc -c)
          if [ "$N_NOSEM" -gt 0 ]; then
            grep -rIilZ $NOSEM_BO 'nosem' . \
              | xargs -0 sed -i -E 's/([Nn][Oo])([Ss][Ee][Mm])/\1_\2/g'
            echo "::warning::$N_NOSEM tep co chu thich nosemgrep - pipeline KHONG ton trong. Bao nham: Dismiss + ly do trong tab Security."
            echo "> ⚠ $N_NOSEM tệp có chú thích \`nosemgrep\` — pipeline không tôn trọng; báo nhầm xử lý bằng Dismiss + lý do." >> $GITHUB_STEP_SUMMARY
          fi

          LOAI="--exclude $TOOLKIT --exclude kiem-thu-rule --exclude .devsecops"
          for d in $NHUNG; do LOAI="$LOAI --exclude $d"; done

          # Luot 1: rule cua bo cong cu + rule rieng cua repo
          # Rule PHAT HIEN theo ngon ngu: C# (sast-detect) + Python + Java.
          # Kiem ton tai tung tep de ban toolkit cu (toolkit-ref ghim tag chua
          # co tep nay) van chay duoc, khong hong vi mot --config tro vao hu vo.
          CFG="--config $TOOLKIT/semgrep-rules/sast-detect.yaml"
          for them in sast-detect-python.yaml sast-detect-java.yaml; do
            if [ -f "$TOOLKIT/semgrep-rules/$them" ]; then
              CFG="$CFG --config $TOOLKIT/semgrep-rules/$them"
            fi
          done
          if [ -d .devsecops/rules ] && ls .devsecops/rules/*.y*ml >/dev/null 2>&1; then
            CFG="$CFG --config .devsecops/rules"
            echo "Them rule rieng cua repo: .devsecops/rules/"
            echo "> Rule riêng của repo trong \`.devsecops/rules/\` được tính vào nhóm có quyền chặn." >> $GITHUB_STEP_SUMMARY
          fi
          echo "Luot 1 (du an): $CFG"
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan $CFG $LOAI --disable-nosem --metrics=off \
            --sarif --output reports/semgrep-du-an-tho.sarif

          # Luot 2: bo rule cong dong theo ngon ngu
          CD=""
          for pack in $PACKS; do CD="$CD --config $pack"; done
          if [ -n "$CD" ]; then
            echo "Luot 2 (cong dong): $CD"
            docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
              semgrep scan $CD $LOAI --disable-nosem --metrics=off \
              --sarif --output reports/semgrep-cong-dong-tho.sarif
          fi

      # ===============================================================
      # TANG 3 - Ha tang: cau hinh trien khai + SBOM
      # Ba tang tren chi doc ma nguon ung dung. Tang nay doc thu ma chung mu:
      # Dockerfile va cac goi he dieu hanh di kem image.
      #
      # Goi thang image Trivy thay vi dung action co san, vi hai ly do:
      #   1. Action phai ghim so phien ban, va mot tag sai lam hong ca job vi
      #      mot ly do khong lien quan gi toi an ninh.
      #   2. Cach nay giong het tools/trivy.py chay tren may lap trinh vien,
      #      nen ket qua cuc bo va ket qua CI so sanh duoc voi nhau.
      # ===============================================================
      - name: Trivy - quet cau hinh trien khai
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          docker run --rm -v "$PWD:/target:ro" -v "$PWD/reports:/out" \
            aquasec/trivy:latest config /target \
            --skip-dirs "/target/$TOOLKIT" \
            --format sarif --output /out/trivy-config.sarif \
            --exit-code 0 --quiet
          echo "Loi cau hinh: $(python -c "import json;print(sum(len(r.get('results',[])) for r in json.load(open('reports/trivy-config.sarif')).get('runs',[])))" 2>/dev/null || echo '?')"

      - name: Trivy - sinh SBOM (CycloneDX)
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          docker run --rm -v "$PWD:/target:ro" -v "$PWD/reports:/out" \
            aquasec/trivy:latest fs /target \
            --skip-dirs "/target/$TOOLKIT" \
            --format cyclonedx --output /out/sbom.cdx.json --quiet

      # ===============================================================
      # TANG 1c - THU VIEN DA CO TRONG REPO (moi he sinh thai)
      #
      # VI SAO BUOC NAY TON TAI. Truoc buoc nay, tang thu vien gom:
      #   sca.py            -> CHI NuGet (dotnet list package --vulnerable)
      #   retire.js         -> CHI thu vien JS nhung san, KHONG doc package.json
      #   dependency-review -> CHI thu vien MOI trong PR
      # Nghia la voi mot repo Python hay Java, cac thu vien DA CO trong
      # requirements.txt hay pom.xml khong tang nao quet. Chi thu vien moi them
      # trong PR moi bi xet - mot repo keo ve voi log4j 2.14.1 co san thi khong
      # canh bao nao. Do la lo hong cua chinh cau "dung duoc cho nhieu loai repo".
      #
      # Trivy DA chay o buoc tren roi, va da doc het cac manifest de sinh SBOM -
      # chi la khong duoc hoi lo hong. Nen bit lo nay chi can them mot lan goi,
      # khong them cong cu moi: trivy fs doc native package-lock.json,
      # requirements.txt, pom.xml, go.sum, Gemfile.lock, packages.lock.json,
      # Cargo.lock, composer.lock.
      #
      # Do duoc bang tools/kiem_thu_sca.py (job `sca` trong kiem-thu-cong-cu.yml):
      # fixture sinh luc chay voi phien ban dinh lo hong biet truoc.
      # ===============================================================
      - name: Trivy - lo hong thu vien da co (moi he sinh thai)
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          docker run --rm -v "$PWD:/target:ro" -v "$PWD/reports:/out" \
            aquasec/trivy:latest fs /target \
            --scanners vuln --skip-dirs "/target/$TOOLKIT" \
            --format sarif --output /out/thu-vien-da-co.sarif \
            --exit-code 0 --quiet
          N=$(python -c "import json;print(sum(len(r.get('results',[])) for r in json.load(open('reports/thu-vien-da-co.sarif')).get('runs',[])))" 2>/dev/null || echo '?')
          echo "Lo hong thu vien da co: $N"
          # Khong co SARIF nghia la KHONG QUET DUOC, khong phai 'sach'.
          test -f reports/thu-vien-da-co.sarif \
            || { echo "::error::Trivy khong ra SARIF - tang nay KHONG quet duoc"; exit 1; }
          echo "SBOM: $(python -c "import json;print(len(json.load(open('reports/sbom.cdx.json')).get('components',[])))" 2>/dev/null || echo '?') thanh phan"

      # Quet image ton them vai phut nen chi chay o nhanh chinh, khi bam tay, va
      # o lan quet dinh ky - khong chay o moi pull request. Danh doi thoi gian
      # CI la mot quyet dinh thiet ke that cua DevSecOps, khong phai cat xen cho
      # tien: cong chan lam lap trinh vien cho lau se bi tim cach vong qua.
      - name: Trivy - quet container image
        if: >-
          inputs.run-image-scan &&
          steps.pham_vi.outputs.chi_tai_lieu != 'true' &&
          (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
           github.event_name == 'workflow_dispatch' ||
           github.event_name == 'schedule')
        run: |
          DF="${{ steps.du_an.outputs.dockerfile }}"
          if [ -z "$DF" ] || [ ! -f "$DF" ]; then
            echo "Repo khong co Dockerfile - bo qua buoc quet image."
            echo "Luu y: day la 'khong quet' chu khong phai 'image sach'."
            exit 0
          fi
          # ngu canh build = goc repo (Dockerfile trong thu muc con kieu Visual Studio can vay)
          docker build -f "$DF" -t quet-ci:latest .
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image quet-ci:latest --scanners vuln \
            --severity CRITICAL,HIGH --quiet || true

      # ===============================================================
      # TANG 4 - Kiem thu dong (DAST) - DOC LAP voi SAST
      #
      # Truoc day ZAP chi ban vao cho SAST chi va co quyen "cho qua" canh bao
      # SAST. Mot SQL injection that da lot qua cong vi the (PR #1 cua
      # VulnShop-App). Gio ZAP quet TOAN BO ung dung dung tu code cua PR, ket
      # qua di thang len Code Scanning nhu mot nguon phat hien rieng. Doi chieu
      # SAST x DAST chi con dung de GAN NHAN "da khai thac duoc" - xep uu tien,
      # khong bao gio dung de bo qua.
      # ===============================================================
      # Khoi dong app KHONG gan voi .NET: start-command -> docker compose ->
      # dotnet -> Dockerfile -> npm start (tools/khoi_dong_app.py). Khong cach
      # nao dung duoc thi DAST bo qua va trang tom tat NOI RO ly do. Da chon
      # mot cach ma app khong len thi job do - app hong trong PR la tin hieu that.
      - name: Build (.NET)
        if: >-
          steps.pham_vi.outputs.chi_tai_lieu != 'true' && inputs.run-dast &&
          inputs.start-command == '' && steps.du_an.outputs.project_file != ''
        run: dotnet build "${{ steps.du_an.outputs.project_file }}" -c Release

      - name: Khoi dong ung dung cho DAST
        id: app
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true' && inputs.run-dast
        env:
          START_CMD: ${{ inputs.start-command }}
        run: |
          python "$TOOLKIT/tools/khoi_dong_app.py" --root . \
            --start-command "$START_CMD" \
            --project-file "${{ steps.du_an.outputs.project_file }}" \
            --dockerfile "${{ steps.du_an.outputs.dockerfile }}" \
            --app-url "${{ inputs.app-url }}" \
            --health-path "${{ inputs.health-path }}" \
            --log reports/app.log --github-output --summary

      - name: Sinh ban do route
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          # Ban do route hien doc duoc controller ASP.NET; stack khac se ra rong
          # va ZAP dua vao spider (xem G0.4: nap OpenAPI neu repo co).
          python "$TOOLKIT/tools/gen_routes_map.py" \
            --root . --base-url "${{ steps.app.outputs.url || 'http://localhost:5000' }}" \
            --out routes_map.json

      # Tren runner Linux dung --network host, nen ZAP goi thang localhost.
      - name: Khoi dong OWASP ZAP dang daemon
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true' && steps.app.outputs.chay == 'true'
        run: |
          # mount workspace chi-doc de ZAP doc duoc tep OpenAPI cua repo (neu co)
          docker run -d --name zap --network host -v "$PWD:/zap/wrk:ro" zaproxy/zap-stable \
            zap.sh -daemon -host 0.0.0.0 -port 8090 \
            -config api.addrs.addr.name=.* \
            -config api.addrs.addr.regex=true \
            -config api.disablekey=true
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8090/JSON/core/view/version/ > /dev/null; then
              echo "ZAP da san sang sau ${i} lan thu."
              exit 0
            fi
            sleep 2
          done
          echo "ZAP khong khoi dong duoc:"; docker logs zap; exit 1

      - name: ZAP - quet toan bo ung dung tam
        if: steps.pham_vi.outputs.chi_tai_lieu != 'true' && steps.app.outputs.chay == 'true'
        run: |
          # tep dac ta API trong repo (openapi*.json/yaml, swagger*.json/yaml)
          API=$(find . -path ./.git -prune -o -path "./$TOOLKIT" -prune -o -path ./node_modules -prune -o -type f \
                \( -iname 'openapi*.json' -o -iname 'openapi*.y*ml' -o -iname 'swagger*.json' -o -iname 'swagger*.y*ml' \) \
                -print | sed 's#^\./##' | paste -sd, -)
          python "$TOOLKIT/tools/dast_scan.py" \
            --routes routes_map.json \
            --openapi "$API" \
            --base-url "${{ steps.app.outputs.url }}" \
            --zap http://localhost:8090 \
            --timeout 600 \
            --kich-ban-loi-sqlite \
            --rule-runtime \
            --kiem-idor .devsecops/idor.json \
            --out reports/zap-alerts.json

      # ===============================================================
      # CHUAN HOA SARIF - de GitHub lam cong
      # Semgrep: tach rule du an / cong dong, ep security-severity ve so,
      #          gan nhan DA KHAI THAC neu ZAP trung cung CWE cung endpoint.
      # ZAP:     JSON -> SARIF, moi alert anh xa ve Controller:dong qua ban do
      #          route de chu thich hien dung cho trong Files changed.
      # ===============================================================
      - name: Chuan hoa SARIF cho Code Scanning
        if: always() && steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          if [ -f reports/semgrep-du-an-tho.sarif ] || [ -f reports/semgrep-cong-dong-tho.sarif ]; then
            python "$TOOLKIT/tools/sarif_tools.py" semgrep \
              --du-an reports/semgrep-du-an-tho.sarif \
              --cong-dong reports/semgrep-cong-dong-tho.sarif \
              --out-du-an reports/semgrep-du-an.sarif \
              --out-cong-dong reports/semgrep-cong-dong.sarif \
              --zap reports/zap-alerts.json --routes routes_map.json
          fi
          if [ -f reports/zap-alerts.json ]; then
            FB="${{ steps.du_an.outputs.tep_du_phong }}"
            python "$TOOLKIT/tools/sarif_tools.py" zap \
              --in reports/zap-alerts.json --routes routes_map.json \
              --fallback-file "$FB" --out reports/zap.sarif
            # G3.3: rule runtime da chon (lam_khoa) -> cong cu RIENG 'DAST-runtime'
            # (nguong Medium, tach khoi cong High cua ZAP). Luon ghi SARIF (rong
            # khi main sach) de thiet lap baseline; PR lam mat header -> alert MOI -> chan.
            python "$TOOLKIT/tools/sarif_tools.py" runtime \
              --in reports/zap-alerts.json \
              --fallback-file "$FB" --out reports/runtime.sarif
            # G3.4: phat hien IDOR/BOLA (neu repo co .devsecops/idor.json) -> cong cu
            # RIENG 'DAST-idor' (CWE-639, muc High -> gate nhu ZAP).
            python "$TOOLKIT/tools/sarif_tools.py" idor \
              --in reports/zap-alerts.json \
              --fallback-file "$FB" --out reports/idor.sarif
          fi

      # ===============================================================
      # TOM TAT cho dev - KHONG chan. Viec khoa merge la cua GitHub
      # (Code scanning results + ruleset). Buoc nay chi viet lai cung nguong
      # do thanh mot bang ngan: co gi phai sua, o dau, sua the nao.
      # ===============================================================
      - name: Tom tat - co gi phai sua khong
        if: always()
        env:
          MOC: ${{ steps.pham_vi.outputs.moc }}
          CHI_TAI_LIEU: ${{ steps.pham_vi.outputs.chi_tai_lieu }}
          CO_DAST: ${{ steps.app.outputs.chay == 'true' }}
          LY_DO_DAST: ${{ !inputs.run-dast && 'run-dast=false' || steps.app.outputs.ly_do }}
          EV: ${{ github.event_name }}
        run: |
          # Bang tong quan tung tang
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, os
          from pathlib import Path
          def j(p):
              q = Path(p); return json.loads(q.read_text(encoding="utf-8")) if q.exists() else None
          def n_sarif(p):
              d = j(p); return sum(len(r.get("results", [])) for r in d.get("runs", [])) if d else None
          print("## Ket qua quet bao mat\n")
          if os.environ.get("CHI_TAI_LIEU") == "true":
              print("> Lan chay nay chi sua tai lieu: cac tang can build/chay app duoc BO QUA CO Y. Tang secret van chay.\n")
          elif os.environ.get("CO_DAST") != "true":
              print(f"> Tang dong (DAST) BI BO QUA: {os.environ.get('LY_DO_DAST') or 'khong ro ly do'}. Chi co bang chung tinh.\n")
          print("| Tang | Ket qua |"); print("|---|---|")
          print(f"| 0. Secret | {os.environ.get('GITLEAKS_COUNT','?')} phat hien |")
          sca = j("reports/sca.json")
          if sca:
              s = sca["summary"]; print(f"| 1. Thu vien | {s['packages']} goi dinh CVE ({s['by_severity']['Critical']} Critical, {s['by_severity']['High']} High) - goi MOI trong PR do dependency-review xet |")
          tv = n_sarif("reports/thu-vien-nhung.sarif")
          print(f"| 1b. Thu vien JS nhung san | {'CHUA quet duoc' if tv is None else f'{tv} lo hong (retire.js)'} |")
          a, b = n_sarif("reports/semgrep-du-an.sarif"), n_sarif("reports/semgrep-cong-dong.sarif")
          if a is not None: print(f"| 2. Ma nguon | rule du an {a} · rule cong dong {b} |")
          rm = j("routes_map.json")
          if rm:
              s = rm.get("summary", {}); print(f"| 3. Pham vi | {s.get('testable',0)}/{sum(s.values())} endpoint DAST toi duoc |")
          z = j("reports/zap-alerts.json")
          if z:
              al = z.get("alerts", []); print(f"| 4. DAST | High {sum(1 for x in al if x['risk']=='High')} · Medium {sum(1 for x in al if x['risk']=='Medium')} · Low/Info {sum(1 for x in al if x['risk'] in ('Low','Informational'))} |")
              rt = z.get("rule_runtime", [])
              if rt:
                  nk = sum(1 for x in rt if x.get("lam_khoa"))
                  print(f"| 4b. Rule runtime | {len(rt)} phat hien header/cookie ({nk} lam_khoa -> DAST-runtime CHAN, {len(rt)-nk} report-only) |")
                  idor = z.get("idor", [])
                  if idor:
                      print(f"| 4d. IDOR/BOLA (co xac thuc) | {len(idor)} phat hien truy cap cheo -> DAST-idor (High, CHAN) |")
          print()
          PY

          ARGS=""
          if [ -f reports/semgrep-du-an.sarif ]; then ARGS="$ARGS --sast reports/semgrep-du-an.sarif"; fi
          if [ -f reports/zap-alerts.json ]; then ARGS="$ARGS --zap reports/zap-alerts.json"; fi
          if [ -f reports/gitleaks.sarif ]; then ARGS="$ARGS --gitleaks reports/gitleaks.sarif"; fi
          if [ -f reports/sca.json ]; then ARGS="$ARGS --sca reports/sca.json"; fi
          if [ -n "$MOC" ]; then ARGS="$ARGS --moc $MOC"; fi
          DS=()
          if [ "$CO_DAST" != "true" ]; then DS=(--dast-skipped "${LY_DO_DAST:-khong ro ly do}"); fi
          # tep khai bao thu vien cua moi he sinh thai pho bien
          if [ -n "$MOC" ] && git diff --name-only "$MOC" HEAD | grep -qE '\.csproj$|packages\.lock\.json$|Directory\.Packages\.props$|(^|/)(package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|requirements[^/]*\.txt|poetry\.lock|Pipfile\.lock|pom\.xml|build\.gradle(\.kts)?|go\.(mod|sum)|Gemfile\.lock|composer\.(json|lock)|Cargo\.lock)$'; then
            ARGS="$ARGS --deps-changed"
          fi
          # Quet dinh ky / chay tay: bat --cve-strict. Luc nay khong co moc baseline
          # (quet day du), nen can chan-bao-cao ca CVE Critical tren thu vien KHONG
          # doi - bat dung truong hop "code chua lo truoc day, nay thu vien bi cong
          # bo CVE moi". PR thuong khong bat (de khong chan merge vi no cu cua nguoi khac).
          if [ "$EV" = "schedule" ] || [ "$EV" = "workflow_dispatch" ]; then
            ARGS="$ARGS --cve-strict"
            echo "==> Quet dinh ky/tay: bat --cve-strict (xet ca CVE Critical tren thu vien khong doi)."
          fi
          python "$TOOLKIT/tools/gate.py" $ARGS "${DS[@]}" --routes routes_map.json \
            --title "$TITLE" --out reports/tom-tat.json || true

      - name: Dung bao cao HTML
        if: always() && steps.pham_vi.outputs.chi_tai_lieu != 'true'
        run: |
          ARGS=""
          if [ -f reports/sca.json ]; then ARGS="$ARGS --sca reports/sca.json"; fi
          if [ -f reports/semgrep-du-an.sarif ]; then ARGS="$ARGS --sast reports/semgrep-du-an.sarif"; fi
          if [ -f routes_map.json ]; then ARGS="$ARGS --routes routes_map.json"; fi
          python "$TOOLKIT/tools/report.py" --title "$TITLE" $ARGS --out reports/bao_cao.html || true

      # ===============================================================
      # DAY LEN CODE SCANNING - day la cong that.
      # Ten check tren PR = "Code scanning results / <ten cong cu trong SARIF>".
      # Ruleset "Require code scanning results" khoa merge theo nguong tung
      # cong cu; chi xet alert MOI trong PR.
      # ===============================================================
      - name: Code Scanning - Semgrep rule du an (co quyen chan)
        if: always() && hashFiles('reports/semgrep-du-an.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/semgrep-du-an.sarif
          category: semgrep-du-an

      - name: Code Scanning - Semgrep rule cong dong (tham khao)
        if: always() && hashFiles('reports/semgrep-cong-dong.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/semgrep-cong-dong.sarif
          category: semgrep-cong-dong

      - name: Code Scanning - OWASP ZAP (co quyen chan o muc High)
        if: always() && hashFiles('reports/zap.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/zap.sarif
          category: zap

      - name: Code Scanning - DAST runtime (rule chon lam khoa, nguong Medium)
        if: always() && hashFiles('reports/runtime.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/runtime.sarif
          category: runtime

      - name: Code Scanning - DAST IDOR/BOLA (CWE-639, muc High)
        if: always() && hashFiles('reports/idor.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/idor.sarif
          category: idor

      - name: Code Scanning - secret
        if: always() && hashFiles('reports/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/gitleaks.sarif
          category: secret

      - name: Code Scanning - cau hinh ha tang
        if: always() && hashFiles('reports/thu-vien-da-co.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/thu-vien-da-co.sarif
          category: thu-vien-da-co

      - name: Day ket qua ha tang len Code Scanning
        if: always() && hashFiles('reports/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/trivy-config.sarif
          category: ha-tang

      - name: Code Scanning - thu vien JS nhung san
        if: always() && hashFiles('reports/thu-vien-nhung.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reports/thu-vien-nhung.sarif
          category: thu-vien-nhung

      - name: Luu bao cao lam artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bao-cao-bao-mat
          path: reports/

      - name: Nhat ky ZAP khi co su co
        if: failure()
        run: docker logs zap 2>/dev/null | tail -50 || true

  # =====================================================================
  # SAST THEO LUONG DU LIEU - CodeQL (job rieng, chay song song voi scan)
  #
  # Semgrep-du-an bat theo HINH DANG dong code: `CommandText = "..." + x` bi
  # bat, nhung `var cauLenh = "..." + x; cmd.CommandText = cauLenh;` hay du
  # lieu di qua mot ham khac, mot tep khac thi lot. CodeQL dung CSDL cua toan
  # bo ma nguon va lan theo du lieu tu NGUON (tham so request, URL, header...)
  # toi DICH (cau SQL, innerHTML, lenh he dieu hanh, duong dan tep...) qua
  # bien, ham, tep. Bo truy van security-extended.
  #
  # Ngon ngu TU NHAN (tools/nhan_ngon_ngu.py): moi ngon ngu CodeQL ho tro la
  # mot job trong ma tran; thu vien nhung san (wwwroot/lib, vendor/...) bo qua.
  # Ket qua len Code Scanning voi ten cong cu "CodeQL". Ruleset chan canh bao
  # MOI tu muc Medium. Do tren Juliet C# (Phong do): chuyen huong mo (6.1),
  # lo thong tin qua loi (5.4), cookie thieu Secure (5.0) duoc CodeQL bat voi
  # 0-3% bao nham nhung deu duoi 7 - dat nguong High thi ca ba loai lot cong.
  # =====================================================================
  nhan-dien:
    # Job VAO: nhan dien ngon ngu mot lan cho moi tang, va quyet dinh lan chay
    # nay co phai trung lap khong.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read      # de biet commit nay da co PR mo chua (chan trung)
    outputs:
      codeql: ${{ steps.nn.outputs.codeql_matrix }}
      nhung: ${{ steps.nn.outputs.thu_muc_nhung }}
      packs: ${{ steps.nn.outputs.semgrep_packs }}
      bo_qua: ${{ steps.trung.outputs.bo_qua }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Keo bo cong cu DevSecOps ve
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
          repository: vhuy811/DevSecOps_VHNAT
          ref: ${{ inputs.toolkit-ref }}
          path: .devsecops-toolkit

      - name: Nhan ngon ngu cho moi tang
        id: nn
        run: python .devsecops-toolkit/tools/nhan_ngon_ngu.py --root . --github-output --summary

      # CHAN TRUNG. Nhanh moi duoc quet du 5 tang nho trigger push. Nhung khi
      # commit do DA co PR mo thi lan chay theo pull_request da phu het, va chay
      # them lan push la duyet hai lan cung mot thu.
      #
      # Chi xet voi event push. Lan chay theo pull_request KHONG BAO GIO bi bo
      # qua, nen cong chan khong the bi lam rong vi buoc nay.
      - name: Chan trung (push ma da co PR thi bo qua)
        id: trung
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "bo_qua=false" >> "$GITHUB_OUTPUT"
            echo "Event la ${{ github.event_name }} - khong xet chan trung."
            exit 0
          fi
          SO=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
                 --jq 'length' 2>/dev/null || echo 0)
          if [ "${SO:-0}" -gt 0 ]; then
            echo "bo_qua=true" >> "$GITHUB_OUTPUT"
            echo "Commit nay da co $SO pull request mo - lan chay theo pull_request da phu."
            echo "> Bo qua lan chay theo \`push\`: commit nay da co pull request, quet o do roi." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "bo_qua=false" >> "$GITHUB_OUTPUT"
            echo "Chua co PR cho commit nay - quet day du 5 tang tren nhanh."
          fi

  codeql:
    needs: nhan-dien
    if: >-
      needs.nhan-dien.outputs.bo_qua != 'true' &&
      needs.nhan-dien.outputs.codeql != '' && needs.nhan-dien.outputs.codeql != '[]'
    name: codeql (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write   # day ket qua len Code Scanning
    strategy:
      fail-fast: false         # mot ngon ngu hong khong keo ngon ngu khac
      matrix:
        include: ${{ fromJSON(needs.nhan-dien.outputs.codeql) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      # Tep cau hinh phai nam TRONG workspace (codeql-action tu choi duong dan
      # ngoai workspace). Tep tam cua CI, repo khong bi dong toi.
      - name: Cau hinh CodeQL - bo qua thu vien nhung san
        env:
          NHUNG: ${{ needs.nhan-dien.outputs.nhung }}
        run: |
          python3 - <<'PY'
          import json, os
          bo = json.loads(os.environ.get("NHUNG") or "[]") + ["**/kiem-thu-rule"]
          with open(".devsecops-codeql.yml", "w", encoding="utf-8") as f:
              # threat model "local": coi ca du lieu tu CSDL, tep, bien moi truong
              # la nguon nguy hiem. Phong do #5: bat 27.5% -> 40.2%, bao nham
              # 3.3% -> 5.2%; nguon CSDL (stored XSS, SQLi bac hai) 0% -> 53%.
              f.write("name: devsecops\nthreat-models: local\npaths-ignore:\n")
              for p in bo:
                  f.write(f"  - {json.dumps(p)}\n")
              # CWE-643 (XPath injection): BO khoi tang CodeQL.
              # Phong do #27 do moi 143 to hop nguong cua cong chan. CodeQL-local
              # bat CWE-643 76% nhung bao nham cung 76% - TOAN BO 5.2% bao nham
              # cua cong den tu dung mot loai nay. Bo no ra:
              #     bat 63.6% -> 61.6% | bao nham 5.2% -> 1.0% | Youden +0.584 -> +0.606
              # va day la to hop tot nhat trong 143 to hop do duoc.
              # KHONG mat do phu: dso-taint-xpathi cua du an bat CWE-643 49% voi
              # 0% bao nham va van co quyen chan. XPath injection van hien trong
              # Code Scanning va van chan merge - chi doi sang cong cu chinh xac
              # hon. Truy van bi loai: cs/xml/xpath-injection, va moi truy van
              # cung tag external/cwe/cwe-643 cua ngon ngu khac.
              f.write("query-filters:\n")
              f.write("  - exclude:\n")
              f.write("      tags contain:\n")
              f.write("        - external/cwe/cwe-643\n")
          PY
          cat .devsecops-codeql.yml

      - name: CodeQL - khoi tao (${{ matrix.language }}, build-mode ${{ matrix.build-mode }})
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
          config-file: ./.devsecops-codeql.yml

      - name: CodeQL - phan tich va day len Code Scanning
        uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
          output: codeql-sarif

      - name: Tom tat CodeQL
        if: always()
        env:
          NN: ${{ matrix.language }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json, os
          from collections import Counter
          nn = os.environ["NN"]
          tep = glob.glob("codeql-sarif/*.sarif")
          if not tep:
              print(f"### CodeQL `{nn}`: KHÔNG có kết quả\n")
              print("> Bước phân tích không sinh SARIF — xem log. Đây là *không có kết quả*, không phải *sạch*.\n")
              raise SystemExit(0)
          rules, res = {}, []
          for f in tep:
              for run in json.load(open(f, encoding="utf-8")).get("runs", []):
                  for c in [run["tool"]["driver"]] + run["tool"].get("extensions", []):
                      for r in c.get("rules", []):
                          rules[r["id"]] = r
                  res += run.get("results", [])
          def rid(r):
              return r.get("ruleId") or (r.get("rule") or {}).get("id", "?")
          def sev(r):
              try:
                  return float((rules.get(rid(r), {}).get("properties") or {}).get("security-severity", 0))
              except ValueError:
                  return 0.0
          muc = Counter("Critical" if sev(r) >= 9 else "High" if sev(r) >= 7 else "Medium" if sev(r) >= 4 else "thấp/không điểm" for r in res)
          print(f"### CodeQL `{nn}`: {len(res)} kết quả trên toàn repo\n")
          print(" · ".join(f"{k} {muc.get(k, 0)}" for k in ("Critical", "High", "Medium", "thấp/không điểm")) + "\n")
          print("Ruleset chỉ chặn cảnh báo **MỚI** trong PR, từ mức Medium (security-severity ≥ 4.0). "
                "Cái mới xem ở check *Code scanning results / CodeQL*.\n")
          dem = Counter((rid(r), sev(r)) for r in res)
          if dem:
              print("| Truy vấn | Số | security-severity |"); print("|---|---|---|")
              for (k, s), n in sorted(dem.items(), key=lambda x: (-x[0][1], -x[1]))[:15]:
                  print(f"| `{k}` | {n} | {s:g} |")
              print()

          # query-filters viet sai mot ky tu thi no LANG LE khong loai gi ca, va
          # nguoi doc se tin cong chan co 1.0% bao nham trong khi that ra van
          # 5.2%. Khong tin vao khoa cau hinh - doi chieu ket qua.
          import sys
          def tag_cua(r):
              pr = (rules.get(rid(r), {}).get("properties") or {})
              return (" ".join(pr.get("tags") or []) + " " + str(pr.get("cwe", ""))).lower()
          con = [r for r in res if "cwe-643" in tag_cua(r)]
          if con:
              print(f"::error::query-filters KHONG loai duoc CWE-643: con {len(con)} canh bao. "
                    "Nguong 1.0% bao nham do tren phong do khong con dung cho pipeline nay.",
                    file=sys.stderr)
              print(f"> **CWE-643 chưa bị loại** — còn {len(con)} cảnh báo. Chuỗi tag trong "
                    "`query-filters` có thể đã sai; báo nhầm thật của cổng vẫn là 5.2%, "
                    "không phải 1.0%.\n")
          else:
              print("> CWE-643 đã loại khỏi tầng CodeQL — đo được báo nhầm 5.2% → 1.0% "
                    "(phòng đo #27). XPath injection vẫn do `dso-taint-xpathi` bắt "
                    "(49% / 0% báo nhầm) và vẫn chặn merge.\n")
              print("> Lưu ý giới hạn của phép kiểm này: *không có* cảnh báo CWE-643 cũng có "
                    "thể chỉ vì repo không có mã XPath. Chỗ xác nhận thật là bảng theo CWE "
                    "của phòng đo, nơi Juliet có 370 case CWE-643.\n")
          PY

  # =====================================================================
  # THU VIEN MOI TRONG PR - dependency-review-action cua GitHub
  # So sanh manifest giua nhanh goc va PR, chi xet goi PR THEM hoac NANG len
  # ban dinh CVE. Job rieng de tren PR no la mot check rieng
  # ("security / dependency-review") - danh dau la required trong ruleset.
  # CVE moi cong bo tren goi CU thi Dependabot lo, khong chan PR nguoi khac.
  # =====================================================================
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  # =====================================================================
  # CONG XAC NHAN (backstop) - bit lo "lo hong that o tep khong doi"
  #
  # Ruleset "Require code scanning results" cua GitHub chi chan canh bao MOI
  # trong code PR DA DOI. Mot lo hong da bi ZAP khai thac thanh cong, hoac IDOR
  # truy cap cheo tai khoan, nhung duoc neo vao tep PR khong dong vao (vi du SQLi
  # o Data/Db.cs trong khi PR chi them Controller) thi GitHub khong tinh la moi
  # va cho merge - do la PR #18 cua VulnShop-App.
  #
  # Job nay la MOT check RIENG, co quyen that bai (khac voi job scan luon xanh).
  # No doc thang zap-alerts.json (khong qua buoc neo route), nen thay lo hong du
  # no nam o dau, va CHAN bat ke dong do co thay doi hay khong - chi tinh phat
  # hien DA KIEM CHUNG DONG (ZAP High tin cay khong-thap, IDOR/BOLA). Lo logic
  # doanh nghiep khong co probe xac nhan nen tu nhien khong roi vao day.
  #
  # Cho qua co kiem soat: baseline (.devsecops/baseline-confirmed.json - no ky
  # thuat da biet tren main) hoac ngoai le co ly_do/nguoi_duyet/het_han
  # (.devsecops/ngoai-le.json, loai 'dast-xac-nhan'). Khong co file nao -> coi
  # main sach -> moi phat hien xac nhan deu chan (fail-closed).
  #
  # DE CHECK NAY CHAN MERGE THAT: them "security / Cong xac nhan (DAST da chung
  # minh)" vao danh sach Required status checks cua ruleset nhanh main.
  # =====================================================================
  cong-xac-nhan:
    name: Cong xac nhan (DAST da chung minh)
    needs: scan
    # Chay CA voi event push: nhanh vua tao (chua co PR) cung phai qua cong
    # nay, de lap trinh vien thay ket qua ngay thay vi doi den luc mo PR.
    #
    # KHONG dua inputs.run-dast vao day. Mot job BI SKIP van lam THOA MAN
    # required status check cua GitHub - nghia la repo nao dat run-dast: false
    # la cong tu "xanh" bang cach khong chay. Job phai CHAY va tu bao cao ket
    # luan; viec run-dast=false duoc xu ly ben trong buoc, co in ro ly do.
    # Chi bo qua khi job scan bi skip (lan chay push trung lap) - luc do khong
    # co artifact nao de xet.
    if: always() && needs.scan.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Keo bo cong cu DevSecOps ve
        uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
          repository: vhuy811/DevSecOps_VHNAT
          ref: ${{ inputs.toolkit-ref }}
          path: .devsecops-toolkit

      - name: Tai bao cao tu job scan
        uses: actions/download-artifact@v7
        with:
          name: bao-cao-bao-mat
          path: reports

      - name: Chan lo hong DAST da chung minh (bat ke dong doi)
        env:
          TOOLKIT: .devsecops-toolkit
        run: |
          # Hai truong hop KHAC NHAU, truoc day bi gop lam mot va deu thoat 0:
          #   a) repo CO Y khong chay tang dong (run-dast: false) -> khong co gi
          #      de xet, cho qua nhung NOI RO day khong phai bang chung sach.
          #   b) tang dong DUOC YEU CAU chay nhung khong ra ket qua (ZAP loi,
          #      app khong len) -> KHONG ket luan duoc, phai CHAN. Cho qua o day
          #      la coi im lang la an toan, trai voi nguyen tac cua ca do an.
          if [ "${{ inputs.run-dast }}" != "true" ]; then
            echo "run-dast=false: repo nay co y khong chay tang dong."
            echo "Cong xac nhan khong co bang chung dong nao de xet."
            echo "Day la 'khong quet', KHONG phai 'da kiem chung va sach'."
            echo "> Cong xac nhan: repo dat \`run-dast: false\`, khong co bang chung dong de xet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ ! -f reports/zap-alerts.json ]; then
            echo "::error::run-dast=true nhung khong co reports/zap-alerts.json."
            echo "Tang dong duoc YEU CAU chay ma khong ra ket qua - khong ket luan duoc."
            echo "Xem log job scan (ZAP hoac buoc khoi dong app). Day la loi ha tang,"
            echo "nhung chua kiem tra thi chua duoc qua."
            exit 1
          fi
          # Khong truyen --summary (no nhan GIA TRI, mac dinh = $GITHUB_STEP_SUMMARY
          # da co san trong CI nen van ghi vao trang Summary).
          python "$TOOLKIT/tools/gate.py" --chan-xac-nhan \
            --zap reports/zap-alerts.json \
            --ngoai-le .devsecops/ngoai-le.json \
            --baseline-xac-nhan .devsecops/baseline-confirmed.json \
            --out reports/cong-xac-nhan.json

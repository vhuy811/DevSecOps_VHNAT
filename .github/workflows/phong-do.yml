name: Phong do

# ==========================================================================
# PHONG DO - do cong cu quet tren bo do DOC LAP Juliet C# 1.3 cua NIST.
#
# Tra loi bang so cho cau hoi: "loi da biet trong code bi bat bao nhieu phan?"
# Moi test case Juliet co ham loi (bad) va ham an toan (good), viet theo nhieu
# duong di cua du lieu (qua bien, qua ham, qua tep, qua collection, ke thua...).
#
# Chay khi:
#   - bam tay (Actions -> Phong do -> Run workflow), chon CWE can do
#   - moi lan sua rule o semgrep-rules/ hoac bo cham diem -> chong hoi quy
#
# KHONG day ket qua len Code Scanning cua repo nay (hang nghin canh bao tren
# ma mau se lam rac tab Security). Ket qua nam o artifact + trang Summary.
# ==========================================================================

on:
  workflow_dispatch:
    inputs:
      cwe:
        description: 'CWE can do, cach nhau dau phay'
        default: '89,78,90,643,23,36,80,81,83,601,113,209,327,328,338,259,321,614,117,319,470'
  push:
    branches: [main]
    paths:
      - 'semgrep-rules/**'
      - 'tools/cham_diem.py'
      - '.github/workflows/phong-do.yml'
  # PR sua rule chay phong do TRUOC khi merge: rule mu / bao nham lo ra o PR,
  # khong phai sau khi da vao main.
  pull_request:
    paths:
      - 'semgrep-rules/**'
      - 'tools/cham_diem.py'
      - '.github/workflows/phong-do.yml'

permissions:
  contents: read
  actions: read
  security-events: write   # codeql-action can quyen nay ke ca khi upload: never

env:
  JULIET_URL: https://samate.nist.gov/SARD/downloads/test-suites/2020-08-01-juliet-test-suite-for-csharp-v1-3.zip
  CWE_MAC_DINH: '89,78,90,643,23,36,80,81,83,601,113,209,327,328,338,259,321,614,117,319,470'

jobs:
  juliet:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      # Kiem thu nhanh tren fixture: moi rule phat hien phai bat case cua no
      # trong Co_Loi.*, khong rule nao duoc bat Da_Khu_Doc.cs. Hong o day thi
      # dung luon, khong ton 10 phut do Juliet.
      - name: Kiem thu rule tren fixture (Co_Loi / Da_Khu_Doc)
        run: python semgrep-rules/kiem-thu-rule/chay_kiem_thu.py

      - name: Tai Juliet C# 1.3 tu NIST SARD
        run: |
          curl -fsSL --retry 3 -o juliet.zip "$JULIET_URL"
          sha256sum juliet.zip | tee juliet.sha256
          unzip -q juliet.zip -d juliet_raw
          TC=$(find juliet_raw -type d -name testcases | head -1)
          SUP=$(find juliet_raw -type d -name testcasesupport | head -1)
          echo "testcases: $TC"; echo "testcasesupport: $SUP"
          test -n "$TC" || { echo "Khong tim thay thu muc testcases trong zip"; find juliet_raw -maxdepth 3 -type d | head -30; exit 1; }
          mkdir -p bench/src ket-qua
          python tools/cham_diem.py chon --goc "$TC" --cwe "${{ inputs.cwe || env.CWE_MAC_DINH }}" --dich bench/src/testcases
          if [ -n "$SUP" ]; then cp -r "$SUP" bench/src/; fi
          cp juliet.sha256 ket-qua/
          # Xoa ban giai nen day du (105 CWE). De lai thi CodeQL C# (build-mode none)
          # doc ca 57.372 tep cua no - lan do dau mat 41 phut chi rieng buoc CodeQL.
          rm -rf juliet_raw juliet.zip
          # Ma mau bien the 01 (co ban) cua moi test case: de doc sink THAT cua cac
          # CWE ma chua cong cu nao bat, truoc khi viet rule cho chung.
          mkdir -p ket-qua/mau
          find bench/src/testcases -name '*_01.cs' -exec cp {} ket-qua/mau/ \;
          echo "Ma mau: $(ls ket-qua/mau | wc -l) tep"

      - name: Semgrep - rule du an (dang co quyen chan trong pipeline)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config semgrep-rules/sast-detect.yaml \
            --no-git-ignore --disable-nosem --metrics=off \
            --sarif --output ket-qua/semgrep-du-an.sarif bench/src

      - name: Semgrep - rule cong dong (p/csharp, p/security-audit)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep \
            semgrep scan --config p/csharp --config p/security-audit \
            --no-git-ignore --disable-nosem --metrics=off \
            --sarif --output ket-qua/semgrep-cong-dong.sarif bench/src

      - name: CodeQL - khoi tao (C#, khong can build, security-extended)
        id: cq_init
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
          queries: security-extended
          source-root: bench/src

      # Action analyze chi dung de dong goi (finalize) CSDL, KHONG chay truy van.
      # Ly do: khi workflow chay tren pull_request, action bat "diff-informed
      # analysis" (log: "Generating diff range extension pack") - chi bao canh bao
      # nam trong cac dong PR sua. Juliet khong nam trong diff nen cot codeql tren
      # PR #7 tut tu 27.5% xuong 8.7%. Chay truy van bang CLI thi ket qua giong
      # nhau du workflow chay tren push, pull_request hay workflow_dispatch.
      - name: CodeQL - dong goi CSDL (khong chay truy van)
        uses: github/codeql-action/analyze@v4
        with:
          upload: never
          skip-queries: true
          category: phong-do-juliet

      - name: CodeQL - phan tich (threat model mac dinh = remote)
        run: |
          CQ="${{ steps.cq_init.outputs.codeql-path }}"
          "$CQ" database analyze "$RUNNER_TEMP/codeql_databases/csharp" \
            codeql/csharp-queries:codeql-suites/csharp-security-extended.qls \
            --format=sarif-latest \
            --output=ket-qua/codeql.sarif --threads=0 --rerun

      # Mac dinh CodeQL chi coi du lieu tu mang (HTTP, socket) la nguon nguy hiem
      # (threat model "remote"), nen nguon CSDL va cuc bo do duoc 0%. Phan tich
      # lai CUNG CSDL voi threat model "local" (them CSDL, tep, bien moi truong,
      # console) de biet bat them bao nhieu va bao nham them bao nhieu - so lieu
      # de quyet dinh co bat cho pipeline hay khong. Loi o buoc nay khong lam
      # hong phep do chinh.
      - name: CodeQL - phan tich lai voi threat model local (do them)
        continue-on-error: true
        run: |
          CQ="${{ steps.cq_init.outputs.codeql-path }}"
          "$CQ" database analyze "$RUNNER_TEMP/codeql_databases/csharp" \
            codeql/csharp-queries:codeql-suites/csharp-security-extended.qls \
            --threat-model=local --format=sarif-latest \
            --output=ket-qua/codeql-local.sarif --threads=0 --rerun
          # --rerun bat buoc: khong co no, CodeQL dung lai ket qua da luu trong CSDL
          # tu buoc phan tich truoc ("No need to rerun ...") va bo qua threat model
          # moi - lan do #4 ra cot codeql-local giong het codeql vi ly do do.

      # Phong do CO Y chay CodeQL KHONG loc, roi mo hinh cong chan bang bo loc
      # ben phia cham diem (&!cwe=643). Hai ly do:
      #   1. Giu nguyen du lieu day du, nen buoc "Do nguong" van so sanh duoc
      #      "co CWE-643" voi "bo CWE-643" - loc o tang CodeQL thi mat kha nang do.
      #   2. Day la cho XAC NHAN chuoi tag external/cwe/cwe-643 that su mang so
      #      643. Neu tag sai thi bo loc nay cung that bai va pipeline-hien-tai
      #      se van hien 5.2% bao nham thay vi 1.0% - sai lech bay ra ngay.
      # Juliet co 370 case CWE-643 nen phep xac nhan nay co co so, khac voi viec
      # quet mot repo khong co ma XPath.
      - name: Cham diem
        run: |
          python tools/cham_diem.py juliet --goc bench/src/testcases \
            --sarif semgrep-du-an=ket-qua/semgrep-du-an.sarif \
            --sarif semgrep-cong-dong=ket-qua/semgrep-cong-dong.sarif \
            --sarif codeql=ket-qua/codeql.sarif \
            --sarif codeql-local=ket-qua/codeql-local.sarif \
            --chan "chi-semgrep=semgrep-du-an:level=error" \
            --chan "pipeline-hien-tai=semgrep-du-an:level=error" \
            --chan "pipeline-hien-tai=codeql-local:sev>=4&!cwe=643" \
            --do-nguong \
            --ten-bo-do "Juliet C# 1.3 (NIST SARD #110)" \
            --out ket-qua/juliet.json --md ket-qua/juliet.md
          cat ket-qua/juliet.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ma mau cac CWE chua cong cu nao bat (ham Bad)
        run: |
          python tools/cham_diem.py mau --goc bench/src/testcases \
            --cwe "23,36,81,113,470,259,321,328,338,319,89:CommandText" --md ket-qua/mau.md > /dev/null
          cat ket-qua/mau.md >> "$GITHUB_STEP_SUMMARY"

      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phong-do-juliet
          path: ket-qua/

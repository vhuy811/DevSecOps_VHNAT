name: Canh gac cong (dinh ky)

# G4.3: Cong chi co gia tri khi NO VAN BAT duoc lo hong. Scanner cap nhat, CSDL
# CVE troi, hay dependency drift co the lam mot lop "mu" ma khong ai hay - vi
# tren PR thuong khong con lo hong de thay no con bat hay khong. Workflow nay
# chay DINH KY (khong doi PR) lai cac bai kiem thu detection tren FIXTURE LO HONG
# CO DINH. Lop nao ngung bat duoc -> job do -> mo Issue de dieu tra ngay.
#
# Fixture co dinh (khong doi theo thoi gian):
#   - kiem_thu_dast_sqlite.py : app gia co endpoint phan chieu loi Microsoft.Data.Sqlite
#   - kiem_thu_runtime.py     : app gia thieu/du header bao mat + co cookie
#   - kiem_thu_idor.py        : app gia co endpoint lo IDOR + form dang nhap co CSRF
#   - kiem_thu_gate.py        : SARIF gia tai hien ca lo hong da chung minh o tep khong doi
#   - chay_kiem_thu.py        : fixture Co_Loi / Da_Khu_Doc cho C#, Python, Java
#   - semgrep-rules/kiem-thu-rule/thu-vien-js/jquery-1.8.1.min.js : thu vien JS co CVE

on:
  schedule:
    - cron: "17 2 * * 1"   # 02:17 UTC moi thu Hai
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Cai phu thuoc Python
        run: pip install requests

      - name: Lop loi Microsoft.Data.Sqlite van bat duoc
        run: python tools/kiem_thu_dast_sqlite.py

      - name: Rule runtime (header/cookie) van bat duoc
        run: python tools/kiem_thu_runtime.py >> "$GITHUB_STEP_SUMMARY"

      - name: retire.js van bat jQuery 1.8.1 (fixture)
        run: |
          mkdir -p ket-qua
          npx --yes retire@5.7.0 --path semgrep-rules/kiem-thu-rule/thu-vien-js --verbose \
            --outputformat json --outputpath ket-qua/retire.json --exitwith 0
          python tools/retire_sarif.py --vao ket-qua/retire.json \
            --ra ket-qua/co-loi.sarif --giu-kiem-thu
          python - <<'PY'
          import json, sys
          n = sum(len(r.get("results", [])) for r in json.load(open("ket-qua/co-loi.sarif"))["runs"])
          print(f"retire.js: {n} ket qua tren fixture jQuery 1.8.1")
          if n == 0:
              print("::error::retire.js KHONG con bat duoc jQuery 1.8.1 - tang 1b mu")
              sys.exit(1)
          PY

      - name: Semgrep rule du an + sanitizer van dung (3 dieu kien)
        run: python semgrep-rules/kiem-thu-rule/chay_kiem_thu.py

      - name: Kiem IDOR/BOLA van bat duoc (ke ca qua form co CSRF)
        run: python tools/kiem_thu_idor.py >> "$GITHUB_STEP_SUMMARY"

      - name: Cong xac nhan van chan duoc lo hong da chung minh
        run: python tools/kiem_thu_gate.py >> "$GITHUB_STEP_SUMMARY"

      - name: Mo Issue neu canh gac that bai
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = "Canh gac cong: mot lop phat hien da NGUNG bat duoc";
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "Workflow **canh-gac-cong** that bai.",
              "",
              "Mot lop (SQLite / runtime / retire.js / Semgrep / IDOR / cong xac nhan) khong con bat duoc fixture lo hong CO DINH.",
              "Cong co the dang 'mu' - dieu tra ngay truoc khi tin vao ket qua xanh cua PR.",
              "",
              `Run: ${run}`,
            ].join("\n");
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: "open", labels: "canh-gac",
            });
            if (open.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo,
                title, body, labels: ["canh-gac", "bao-mat"],
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: open.data[0].number, body,
              });
            }

name: Kiem thu cong cu (tang 1b)

# Kiem thu dau-cuoi cho tang thu vien JS nhung san: chay retire.js THAT tren
# mot tep jQuery GIA (chi co chu thich dau tep "jQuery v1.8.1"), doi sang SARIF
# bang tools/retire_sarif.py, roi kiem tra ket qua. Giong chay_kiem_thu.py cua
# bo rule: cong cu chua chay thu tren dau vao biet truoc dap an thi chua tin duoc.
on:
  pull_request:
    paths:
      - tools/retire_sarif.py
      - tools/dast_scan.py
      - tools/kiem_thu_dast_sqlite.py
      - tools/kiem_thu_runtime.py
      - tools/kiem_thu_idor.py
      - tools/idor.py
      - tools/sarif_tools.py
      - tools/gate.py
      - tools/kiem_thu_gate.py
      - tools/kiem_bypass.py
      - tools/kiem_thu_bypass.py
      - tools/kiem_thu_sca.py
      - .github/workflows/devsecops.yml
      - tools/chinh-sach-zap.json
      - semgrep-rules/**
      - .github/workflows/kiem-thu-cong-cu.yml
      - .github/workflows/devsecops-reusable.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dast_sqlite:
    # G3.2: lop error-based Microsoft.Data.Sqlite cua dast_scan.py chay voi mot
    # app gia, kiem tra bat dung endpoint co loi va khong bao nham. Chi stdlib.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Kiem thu lop error-based Microsoft.Data.Sqlite
        run: python tools/kiem_thu_dast_sqlite.py

  runtime:
    # G3.3: rule runtime (header bao mat + co cookie) theo chinh-sach-zap.json,
    # chay voi app gia thieu/du header. Chi stdlib.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Kiem thu rule runtime (header/cookie)
        run: python tools/kiem_thu_runtime.py >> "$GITHUB_STEP_SUMMARY"

  idor:
    # G3.4: kiem IDOR/BOLA co xac thuc - app gia co endpoint lo va endpoint an
    # toan, khang dinh bo kiem bat dung lo va khong bao nham. Chi stdlib.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Kiem thu kiem IDOR/BOLA
        run: python tools/kiem_thu_idor.py >> "$GITHUB_STEP_SUMMARY"

  retire:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: retire.js tren fixture
        run: |
          mkdir -p ket-qua
          npx --yes retire@5.7.0 --path semgrep-rules/kiem-thu-rule/thu-vien-js --verbose \
            --outputformat json --outputpath ket-qua/retire.json --exitwith 0
          python -m json.tool ket-qua/retire.json | head -60

      - name: Doi sang SARIF va kiem tra dap an
        run: |
          # 1) Fixture phai bi bat: jQuery 1.8.1 co nhieu CVE da cong bo.
          #    --giu-kiem-thu: TAT loai tru mac dinh kiem-thu-rule o rieng lan nay.
          python tools/retire_sarif.py --vao ket-qua/retire.json --ra ket-qua/co-loi.sarif \
            --giu-kiem-thu --summary >> "$GITHUB_STEP_SUMMARY"
          # 2) Chay nhu trong pipeline (loai tru kiem-thu-rule): phai ra 0 ket qua.
          python tools/retire_sarif.py --vao ket-qua/retire.json --ra ket-qua/loai-tru.sarif
          # 3) Thieu dau vao: phai thoat ma khac 0 va KHONG ghi SARIF.
          #    (2>/dev/null: annotation ::error:: o day la DU KIEN, khong de hien do.)
          if python tools/retire_sarif.py --vao ket-qua/khong-co.json --ra ket-qua/loi.sarif 2>/dev/null; then
            echo "::error::Thieu dau vao ma van thoat 0"; exit 1
          fi
          test ! -f ket-qua/loi.sarif || { echo "::error::Loi ma van ghi SARIF"; exit 1; }
          # 4) Duong dan ngoai thu muc lam viec: phai bi tu choi.
          if python tools/retire_sarif.py --vao /etc/hostname --ra ket-qua/ngoai.sarif 2>/dev/null; then
            echo "::error::Doc tep ngoai thu muc lam viec ma khong bi tu choi"; exit 1
          fi
          test ! -f ket-qua/ngoai.sarif || { echo "::error::Bi tu choi ma van ghi SARIF"; exit 1; }
          python - <<'PY'
          import json, sys
          a = json.load(open("ket-qua/co-loi.sarif"))["runs"][0]
          b = json.load(open("ket-qua/loai-tru.sarif"))["runs"][0]
          loi = []
          if a["tool"]["driver"]["name"] != "retire.js":
              loi.append("ten cong cu trong SARIF phai la retire.js (ruleset dua vao ten nay)")
          if not a["results"]:
              loi.append("retire.js + retire_sarif.py KHONG bat duoc jQuery 1.8.1 - tang 1b mu")
          for r in a["results"]:
              uri = r["locations"][0]["physicalLocation"]["artifactLocation"]["uri"]
              if not uri.endswith("thu-vien-js/jquery-1.8.1.min.js") or uri.startswith("/"):
                  loi.append(f"duong dan sai: {uri}")
                  break
          diem = {x["id"]: float(x["properties"]["security-severity"]) for x in a["tool"]["driver"]["rules"]}
          if not all(0 < d <= 10 for d in diem.values()):
              loi.append(f"security-severity ngoai khoang: {diem}")
          if b["results"]:
              loi.append(f"loai tru kiem-thu-rule khong chay: con {len(b['results'])} ket qua")
          print(f"{len(a['results'])} ket qua, {len(diem)} rule:", ", ".join(sorted(diem)))
          if loi:
              print("KIEM THU THAT BAI:"); [print("  -", x) for x in loi]; sys.exit(1)
          print("KIEM THU DAT")
          PY

  gate:
    # G6: CONG XAC NHAN (backstop). Tai hien dung ca PR #18 cua VulnShop-App -
    # lo hong da bi ZAP khai thac thanh cong nhung neo vao tep PR khong dong
    # vao - va khang dinh cong chan duoc. Kiem ca hai chieu: ngoai le con hieu
    # luc hoac baseline thi cho qua, ngoai le het han thi van chan, va che do
    # thuong van luon thoat 0 (GitHub moi la cong). Kem guard duong dan --out.
    # Chi stdlib.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Kiem thu cong xac nhan
        run: python tools/kiem_thu_gate.py >> "$GITHUB_STEP_SUMMARY"

  rule_semgrep:
    # KIEM THU BO RULE - truoc day chi chay TAY (can Docker cuc bo), nen rule
    # moi them vao khong ai kiem trong CI. Do dung la cach mot rule MU di vao
    # pipeline: quet xong, khong bao gi, nguoi doc tuong ma nguon sach.
    #
    # Ba dieu kien (xem chay_kiem_thu.py):
    #   1. moi rule phat hien phai bat duoc case co loi cua no
    #   2. khong rule nao duoc bat nham fixture Da_Khu_Doc.* (duong tinh gia)
    #   3. moi rule sanitizer phai tim duoc bang chung khu doc
    # Phu C# + Python + Java, moi ngon ngu mot cap fixture Co_Loi / Da_Khu_Doc.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Cai semgrep
        run: pip install semgrep

      - name: Kiem thu bo rule (C# + Python + Java)
        run: |
          # pipefail: tee khong duoc che mat ma thoat cua kiem thu.
          set -o pipefail
          python semgrep-rules/kiem-thu-rule/chay_kiem_thu.py | tee -a "$GITHUB_STEP_SUMMARY"

  bypass:
    # G5.1: KIEM CAC DUONG LACH CONG. Lo hong lach cong o PR #18 va lo hong
    # `// nosemgrep` o PR #1 deu tim duoc bang tay SAU KHI da lot. Job nay bien
    # tung chot da bit thanh mot phep kiem, de lan sau ai sua workflow ma bo mat
    # chot thi biet ngay chu khong phai doi mot PR thu nghiem.
    #
    # Chay HAI buoc, va buoc thu hai moi la buoc quan trong:
    #   1. kiem_bypass.py      - 16 chot con nguyen khong
    #   2. kiem_thu_bypass.py  - PHA tung chot roi doi hoi bo kiem phai bao
    # Thieu buoc 2 thi khong phan biet duoc "chot con nguyen" voi "phep kiem
    # hong". Lan dau chay buoc 2 da bat duoc mot phep kiem trang tri that
    # (persist-credentials dem so lan xuat hien thay vi doc cau truc YAML).
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Cai PyYAML (kiem_bypass doc cau truc YAML, khong dem chu)
        run: python -m pip install --quiet pyyaml
      - name: Chot lach cong con nguyen khong
        run: |
          set -o pipefail
          python tools/kiem_bypass.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pha tung chot - bo kiem co bat duoc khong
        run: |
          set -o pipefail
          python tools/kiem_thu_bypass.py | tee -a "$GITHUB_STEP_SUMMARY"

  secret:
    # G6.5: DAP AN CHO TANG T0 (Gitleaks). Tang secret la mot trong hai tang
    # CHUA CO BO DO nao. Pipeline chay Gitleaks voi cau hinh MAC DINH va bao
    # cao chi noi "Gitleaks: N phat hien" - N=0 co the nghia la "ma nguon sach"
    # hoac "khong rule nao khop", hai dieu rat khac nhau. Job nay phan biet.
    #
    # FIXTURE SINH LUC CHAY, KHONG COMMIT - bat buoc, vi hai ly do:
    #   1. GitHub co push protection: commit mot chuoi CO HINH DANG secret that
    #      se lam GitHub CHAN ca lan push, keo theo moi commit khac trong nhanh.
    #   2. Tep "secret mau" nam trong repo se bi chinh Gitleaks cua pipeline bat
    #      o moi lan chay, sinh canh bao vinh vien.
    # Sinh vao RUNNER_TEMP, ngoai cay lam viec, nen khong co duong nao lan vao
    # repo. Cung cach lam voi job sca.
    #
    # Dap an co HAI MUC: "chac_chan" (khang dinh - bo sot hay bao nham o day la
    # sai that) va "can_do" (chua biet Gitleaks mac dinh xu ly the nao, chi in
    # ra de doc). Doan truoc roi khang dinh la cach tu lua, nen nhung case chua
    # biet chi duoc chuyen sang muc khang dinh SAU khi co ket qua lan dau.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Tu kiem ham cham (khong can Gitleaks)
        run: |
          set -o pipefail
          python tools/kiem_thu_secret.py --tu-kiem | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sinh fixture secret (ngoai cay lam viec, khong commit)
        run: |
          python tools/kiem_thu_secret.py --sinh "$RUNNER_TEMP/fixture-secret" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Gitleaks - quet fixture (cung cau hinh nhu pipeline)
        run: |
          mkdir -p ket-qua
          # --no-git: fixture khong phai repo git. --exit-code 0: de buoc cham
          # quyet dinh dat/hong, khong phai gitleaks.
          # KHONG dung --redact: bo cham can doc ten tep, va gia tri deu la gia.
          docker run --rm \
            -v "$RUNNER_TEMP/fixture-secret:/repo:ro" \
            -v "$PWD/ket-qua:/ra" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --no-git \
            --report-format=sarif --report-path=/ra/gitleaks.sarif \
            --exit-code 0
          # Gitleaks KHONG tao tep SARIF khi khong tim thay gi - cung cai bay da
          # xu ly trong devsecops-reusable.yml. O day "khong co tep" nghia la bo
          # sot TAT CA, va bo cham phai bao hong chu khong duoc im lang.
          if [ ! -f ket-qua/gitleaks.sarif ]; then
            echo "Gitleaks khong sinh bao cao - coi nhu 0 phat hien."
            printf '{"version":"2.1.0","runs":[]}' > ket-qua/gitleaks.sarif
          fi

      - name: Cham - bat duoc gi, bao nham gi
        run: |
          set -o pipefail
          python tools/kiem_thu_secret.py \
            --sarif ket-qua/gitleaks.sarif \
            --md ket-qua/secret.md \
            | tee -a "$GITHUB_STEP_SUMMARY"

  bo-cham:
    # G6.1: KIEM CHINH BO CHAM. Moi con so trong bao cao di qua tools/cham_diem.py
    # - ti le bat, ti le bao nham, bang theo CWE, bang do nguong - va cho den gio
    # bo cham do khong he co phep kiem nao. Mot loi gan vai tro trong do khong
    # lam chuong trinh chet va khong in canh bao, chi lam con so sai: da gap hai
    # lan (sig_re thieu nhanh "throws" -> doc 0/5 ham; thieu tien to "Servlet_"
    # -> 1332 case khong phan loai duoc). Ca hai chi lo ra khi co nguoi ngoi doc
    # bang. Job nay bien viec doc do thanh phep kiem tu dong.
    #
    # Hai buoc, buoc thu hai moi quan trong (giong job bypass): kiem_thu chay
    # tren corpus do day co dap an biet truoc; kiem_thu_pha PHA bo cham theo 7
    # cach roi doi hoi phep kiem phai hong. Lan dau chay buoc 2 da bat duoc mot
    # lo that trong buoc 1 (khong co case nao kiem ham long nhau) va mot ham
    # chet (ham_chua) van con trong ma nhu the dang duoc dung.
    #
    # Khong can Semgrep, CodeQL hay docker: SARIF duoc sinh tai cho.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      # Chay TRUOC moi thu: re, khong can docker/mang, va bat duoc loai loi
      # lam chet job o giay thu 23 (xem tools/kiem_workflow.py).
      - name: Cau hinh CI co loi da tung lam hong CI khong
        run: |
          set -o pipefail
          python tools/kiem_workflow.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bo cham gan vai tro va tach rule co dung khong
        run: |
          set -o pipefail
          python tools/kiem_thu_cham_diem.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Pha bo cham - phep kiem co bat duoc khong
        run: |
          set -o pipefail
          python tools/kiem_thu_pha_cham_diem.py | tee -a "$GITHUB_STEP_SUMMARY"

  ha-tang:
    # G5.3: DO TANG HA TANG. Tang nay la tang CUOI CUNG chua co bo do nao, va
    # no vua bi phat hien la khong co dong nao trong bang tom tat ket qua -
    # chay that, day SARIF that, nhung nguoi doc bao cao khong thay gi.
    #
    # Fixture SINH LUC CHAY, khong commit: mot Dockerfile co loi co y va mot
    # ban da sua cua chinh no. Doi hoi ban co loi bi bat VA ban da sua im lang.
    # Dieu kien thu hai quan trong ngang dieu kien thu nhat.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config

      - name: Tu kiem ham cham (khong can Trivy)
        run: |
          set -o pipefail
          python tools/kiem_thu_hatang.py --tu-kiem | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sinh Dockerfile fixture (ngoai cay lam viec, khong commit)
        run: |
          python tools/kiem_thu_hatang.py --sinh "$RUNNER_TEMP/fixture-hatang" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Trivy config - quet fixture (cung cau hinh nhu pipeline)
        run: |
          mkdir -p ket-qua
          docker run --rm \
            -v "$RUNNER_TEMP/fixture-hatang:/target:ro" \
            -v "$PWD/ket-qua:/out" \
            aquasec/trivy:latest config /target \
            --format sarif --output /out/trivy-config.sarif \
            --exit-code 0
          if [ ! -f ket-qua/trivy-config.sarif ]; then
            echo "Trivy khong sinh bao cao - coi nhu 0 phat hien."
            printf '{"version":"2.1.0","runs":[]}' > ket-qua/trivy-config.sarif
          fi

      - name: Cham - bat duoc gi, bao nham gi
        run: |
          set -o pipefail
          python tools/kiem_thu_hatang.py \
            --sarif ket-qua/trivy-config.sarif \
            --md ket-qua/hatang.md \
            | tee -a "$GITHUB_STEP_SUMMARY"

  ban-do-route:
    # G5.4: DO TANG T3. Ban do route khong tim lo hong, nhung no quyet dinh
    # DAST quet cho nao. Mot endpoint bi xep nham thi khong duoc quet, va bao
    # cao van ghi "khong tim thay lo hong" - dung cai ket qua ma mot lan quet
    # sach cung cho ra.
    #
    # Day la tang CUOI CUNG trong nam tang khong co phep do. Phat hien khi ra
    # soat do phu cua chinh bo tu kiem nay. Lan dau chay no da bat duoc mot
    # loi that: [Authorize] dat o cap PHUONG THUC khong duoc tinh, chi
    # [Authorize] o cap lop moi duoc - nen mot action can dang nhap bi xep la
    # testable.
    #
    # Khong can docker, khong can mang.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Phan loai endpoint co dung dap an khong
        run: |
          set -o pipefail
          python tools/kiem_thu_banto.py | tee -a "$GITHUB_STEP_SUMMARY"

  sca:
    # G5.2: DO TANG THU VIEN. Tang nay la tang duy nhat tung khong co bo do nao,
    # nen cau "bo sot bao nhieu" khong tra loi duoc. Fixture duoc SINH RA LUC
    # CHAY trong thu muc tam voi phien ban dinh lo hong biet truoc, va khong bao
    # gio duoc commit: manifest ghim phien ban dinh lo hong ma commit vao repo
    # thi Dependabot cua chinh repo nay bao dong va tang SCA chan moi PR.
    #
    # Do tren bon he sinh thai (npm, pip, maven, nuget) vi lo da phat hien la:
    # sca.py chi doc NuGet, retire.js chi doc JS nhung san, dependency-review
    # chi xet thu vien MOI trong PR - nen thu vien DA CO cua repo Python hay
    # Java khong tang nao quet. Buoc "Trivy - lo hong thu vien da co" trong
    # devsecops-reusable.yml la ban bit, va job nay la phep do cua ban bit do.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Tu kiem ham cham diem (khong can Trivy)
        run: |
          set -o pipefail
          python tools/kiem_thu_sca.py --tu-kiem | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Sinh fixture (khong commit tep nao trong nay)
        run: python tools/kiem_thu_sca.py --sinh fixture-sca
      - name: Trivy fs tren fixture
        run: |
          mkdir -p ket-qua
          docker run --rm -v "$PWD/fixture-sca:/target:ro" -v "$PWD/ket-qua:/out" \
            aquasec/trivy:latest fs /target --scanners vuln \
            --format sarif --output /out/trivy-fs.sarif --exit-code 0 --quiet
      - name: Cham diem
        run: |
          set -o pipefail
          python tools/kiem_thu_sca.py --sinh fixture-sca \
            --trivy-sarif ket-qua/trivy-fs.sarif \
            --md ket-qua/sca.md | tee -a "$GITHUB_STEP_SUMMARY"

  pham-vi:
    # G5.5: DO BUOC QUYET DINH "BO QUA TANG NAO".
    # Ruleset danh dau 8 cong cu la bat buoc bao ket qua. Buoc `pham_vi` trong
    # devsecops-reusable.yml la cho DUY NHAT quyet dinh co bo qua cac tang hay
    # khong, va no duoc giu dung bang mot menh de shell:
    #     && [ "$EV" = "pull_request" ]
    # Mat menh de do thi PR chi sua README se bo 7/8 cong cu -> GitHub treo PR
    # vinh vien o "Code scanning is waiting for results", khong merge duoc va
    # khong co thong bao nao noi vi sao.
    #
    # Du an nay da hoc mot lan rang mot dong CHU THICH khong ngan duoc tai pham
    # (e9c58a7 sua, 5a7881a dua loi tro lai, CI #3 hong y het CI #1). Nen menh
    # de do duoc phong do bang mot phep kiem CHAY THAT: phep do lay dung doan
    # shell trong workflow ra chay tren repo git that, roi tu dot bien chinh no
    # de chung minh no co do that.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - run: pip install --quiet pyyaml
      - name: Do buoc pham_vi + dot bien
        run: |
          set -o pipefail
          python tools/kiem_thu_phamvi.py | tee -a "$GITHUB_STEP_SUMMARY"

  dac-ta-ruleset:
    # G5.6: DO LOGIC CANH GIU RULESET.
    # Ruleset la thu DUY NHAT chan merge, va no khong nam trong ma nguon - no
    # nam trong cau hinh tay tren giao dien GitHub. tools/kiem_ruleset.py doc
    # ruleset that qua REST API va doi chieu voi ruleset_mong_doi.json.
    #
    # Job nay KHONG goi API (can token, khong chay duoc o may lap trinh vien).
    # No do HAM doi_chieu() bang cac phan hoi API ghi san, moi ca do la mot cach
    # ruleset co the bi lam yeu that: go mot cong cu, ha nguong, tat mot luat,
    # go mot required check.
    #
    # Phep do nay da bat mot loi that ngay khi viet: danh sach thu tu nguong bi
    # viet NGUOC (`critical` dat o cuoi nhu thu manh nhat, trong khi critical =
    # CHI chan Critical = de lot moi lo hong High). Neu khong co job nay, ruleset
    # bi ha xuong critical-only van duoc bao DAT.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Do logic doi chieu ruleset
        run: |
          set -o pipefail
          python tools/kiem_thu_ruleset.py | tee -a "$GITHUB_STEP_SUMMARY"

  dast-post:
    # G6.8: DO LOP POST CUA TANG DAST.
    # Do do phu DAST tren VulnShop ra 4/15 endpoint (27%). Nguyen nhan KHONG
    # phai dang nhap (needs_auth = 0) ma la PHUONG THUC: 5 endpoint POST mang
    # 8 tham so chua bao gio duoc do - trong do co /Account/Login
    # (username, password) va /Order/PlaceOrder (customerName, address), dung
    # cac vi tri SQLi hay nam nhat trong mot ung dung that.
    #
    # Lop POST phai vuot ba cua, moi cua la mot cach no co the IM LANG hong:
    #   1. doc duoc form that trong HTML (action + ten truong)
    #   2. mang theo token chong CSRF + cookie - thieu thi app tra 400 va lop
    #      bao "khong thay gi" trong khi chua he kiem duoc gi
    #   3. so sanh voi dau vao lanh - thieu thi endpoint nao luon loi cung bi
    #      ke la SQLi
    # Job nay do ca ba cua tren mot app gia, va tu dot bien de chung minh no
    # thuc su do: bo token / bo so sanh dau vao lanh / nhan ca form GET.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false   # khong de GITHUB_TOKEN lai trong .git/config
      - name: Do lop POST + dot bien
        run: |
          set -o pipefail
          python tools/kiem_thu_dast_post.py | tee -a "$GITHUB_STEP_SUMMARY"
